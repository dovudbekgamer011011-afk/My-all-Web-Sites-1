<!DOCTYPE html><html lang="uz"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CodeLab</title><style>:root{--c:#1d4ed8}*{margin:0;padding:0;box-sizing:border-box}body{font-family:system-ui,sans-serif;background:#f1f5f9;color:#1e293b;line-height:1.5;min-height:100vh}.container{max-width:900px;margin:0 auto;padding:20px}header{background:var(--c);color:#fff;padding:24px 20px;border-radius:0 0 20px 20px;margin-bottom:24px;text-align:center}header h1{font-size:1.8rem}header p{opacity:.9}.card{background:#fff;border-radius:14px;padding:20px;margin-bottom:16px;box-shadow:0 2px 8px rgba(0,0,0,.06)}h2{color:var(--c);margin-bottom:12px}button{background:var(--c);color:#fff;border:none;padding:10px 18px;border-radius:8px;cursor:pointer;font-size:1rem}button:hover{filter:brightness(1.1)}input,textarea,select{width:100%;padding:10px 12px;border:1px solid #cbd5e1;border-radius:8px;font-size:1rem;margin-bottom:10px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}.item{background:#f8fafc;border-radius:10px;padding:14px;border-left:4px solid var(--c)}footer{text-align:center;color:#94a3b8;font-size:.8rem;padding:20px;margin-top:30px}.success{color:#16a34a}.hidden{display:none}</style></head><body><header><h1>CodeLab</h1><p>Kod</p></header><div class="container"><div class="card"><select id="ch" onchange="load()"><option value="0">Two Sum</option><option value="1">Palindrome</option><option value="2">FizzBuzz</option></select><p id="desc" style="margin:12px 0"></p><textarea id="code" rows="8" style="font-family:monospace"></textarea><button onclick="run()" style="width:100%;margin-top:8px">Run</button><pre id="out" style="background:#1e293b;color:#e2e8f0;padding:12px;border-radius:8px;margin-top:12px;min-height:40px"></pre></div></div><footer>Ishlaydigan web-sayt</footer><script>const C=[{d:"Two sum toping",t:"function twoSum(nums,target){\n  // code\n}\nconsole.log(twoSum([2,7,11,15],9));"},{d:"Palindrome?",t:"function isPal(s){\n  // code\n}\nconsole.log(isPal(\"radar\"));"},{d:"FizzBuzz",t:"function fizzBuzz(n){\n  // code\n}\nconsole.log(fizzBuzz(15));"}];function load(){const c=C[document.getElementById("ch").value];document.getElementById("desc").textContent=c.d;document.getElementById("code").value=c.t;document.getElementById("out").textContent=""}function run(){try{const logs=[];const o=console.log;console.log=(...a)=>logs.push(a.join(" "));new Function(document.getElementById("code").value)();console.log=o;document.getElementById("out").textContent=logs.join("\n")||"OK"}catch(e){document.getElementById("out").textContent="Xato: "+e.message}}load()</script></body></html>
