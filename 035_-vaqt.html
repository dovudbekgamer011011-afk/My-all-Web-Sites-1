<!doctype html><html lang=uz><meta charset=utf-8><meta name=viewport content='width=device-width,initial-scale=1'><title>Vaqt kuzatuvchi</title><style>:root{--a:#f59e0b;--b:#ef4444}:root{--bg:#f4f5fb;--c:#fff;--t:#1c2033;--m:#6c7293;--l:#e4e7f3}@media(prefers-color-scheme:dark){:root{--bg:#0f1224;--c:#181c36;--t:#eceeff;--m:#9aa0c8;--l:#2a2f55}}*{box-sizing:border-box}body{margin:0;font:15px/1.5 system-ui,sans-serif;background:var(--bg);color:var(--t)}header{background:linear-gradient(135deg,var(--a),var(--b));color:#fff;padding:26px 18px 40px}header h1{margin:0;font-size:26px}header p{margin:4px 0 0;opacity:.85}main{max-width:760px;margin:-22px auto 30px;padding:0 14px;display:grid;gap:14px}.k{background:var(--c);border:1px solid var(--l);border-radius:18px;padding:16px;box-shadow:0 8px 24px rgba(30,40,100,.08)}input,select,textarea{font:inherit;color:var(--t);background:var(--bg);border:1px solid var(--l);border-radius:12px;padding:10px 12px;width:100%;outline:0}input:focus,select:focus,textarea:focus{border-color:var(--a)}button{font:inherit;border:0;border-radius:12px;padding:9px 13px;background:var(--a);color:#fff;font-weight:600;cursor:pointer}button.g{background:var(--bg);color:var(--t);border:1px solid var(--l)}.r{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}.s{text-align:center}.s b{display:block;font-size:26px;color:var(--a)}.s small{color:var(--m)}table{width:100%;border-collapse:collapse}td,th{padding:8px;border-bottom:1px solid var(--l);text-align:left}.i{border:1px solid var(--l);border-radius:14px;padding:12px;margin:8px 0}</style><header><h1>Vaqt kuzatuvchi</h1><p>Qaysi ishga qancha vaqt sarflayotganingizni biling</p></header><main>
<div class=k><div style="display:flex;gap:8px"><input id=n placeholder="Yangi loyiha yoki ish nomi" onkeydown="event.key=='Enter'&&add()"><button onclick=add()>Qo'shish</button></div></div>
<div class=k><div class=s><b id=big style="font-size:40px">00:00:00</b><small>bugun jami</small></div><div id=ls style="margin-top:10px"></div></div>
<div class=k><b>So'nggi 7 kun</b><div id=wk style="display:flex;gap:8px;align-items:flex-end;height:140px;margin-top:10px"></div></div>
<script>const PC=['#f59e0b','#ef4444','#6366f1','#10b981','#06b6d4','#ec4899'],iso=x=>{x=new Date(x);return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0')},hms=s=>[s/3600|0,s/60%60|0,s%60].map(x=>String(x|0).padStart(2,'0')).join(':');
let D=JSON.parse(localStorage.vq||'{"t":[],"l":[],"run":null}');
function sv(){localStorage.vq=JSON.stringify(D)}
function stop(){if(!D.run)return;let s=Math.round((Date.now()-D.run.at)/1000);if(s>0)D.l.push({t:D.run.id,d:iso(D.run.at),s});D.run=null}
function tg(id){let was=D.run&&D.run.id==id;stop();if(!was)D.run={id,at:Date.now()};sv();R()}
function add(){if(!n.value.trim())return;D.t.push({id:Date.now(),n:n.value.trim()});n.value='';sv();R()}
function day(k,id){return D.l.filter(x=>x.d==k&&(id==null||x.t==id)).reduce((a,x)=>a+x.s,0)+(D.run&&iso(D.run.at)==k&&(id==null||D.run.id==id)?Math.round((Date.now()-D.run.at)/1000):0)}
function R(){let k=iso(Date.now()),tot=day(k),mx=Math.max(1,...D.t.map(t=>day(k,t.id)));big.textContent=hms(tot);
ls.innerHTML=D.t.map((t,i)=>{let s=day(k,t.id),on=D.run&&D.run.id==t.id;return `<div class=i style="${on?'border-color:var(--a)':''}"><div style="display:flex;align-items:center;gap:8px"><span style="width:10px;height:10px;border-radius:50%;background:${PC[i%6]}"></span><b style="flex:1">${t.n}</b><b>${hms(s)}</b><button class="${on?'':'g'}" onclick=tg(${t.id})>${on?'⏸ To\'xtatish':'▶ Boshlash'}</button><button class=g onclick="confirm('Ish va uning tarixi o\'chirilsinmi?')&&(stop(),D.t.splice(${i},1),D.l=D.l.filter(x=>x.t!=${t.id}),sv(),R())">✕</button></div><div style="height:6px;background:var(--bg);border-radius:6px;margin-top:8px"><div style="height:100%;width:${s/mx*100}%;background:${PC[i%6]};border-radius:6px"></div></div></div>`}).join('')||'<p>Birinchi ishni qo\'shing</p>';
let days=[...Array(7)].map((_,i)=>{let x=new Date();x.setDate(x.getDate()-6+i);return[iso(x),['Ya','Du','Se','Ch','Pa','Ju','Sh'][x.getDay()]]}),v=days.map(d=>day(d[0])),m=Math.max(1,...v);
wk.innerHTML=days.map((d,i)=>`<div style="flex:1;text-align:center;height:100%;display:flex;flex-direction:column"><div style="flex:1;display:flex;align-items:flex-end"><div title="${hms(v[i])}" style="width:100%;height:${v[i]/m*100}%;min-height:3px;background:linear-gradient(var(--a),var(--b));border-radius:8px 8px 0 0"></div></div><small>${d[1]}</small><small style="color:var(--m)">${(v[i]/3600).toFixed(1)}h</small></div>`).join('')}
R();setInterval(()=>{if(D.run)R()},1000)</script>
