<!DOCTYPE html><html lang="uz"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Coffee</title><style>:root{--c:#78350f}*{margin:0;padding:0;box-sizing:border-box}body{font-family:system-ui,sans-serif;background:#f1f5f9;color:#1e293b;line-height:1.5;min-height:100vh}.container{max-width:900px;margin:0 auto;padding:20px}header{background:var(--c);color:#fff;padding:24px 20px;border-radius:0 0 20px 20px;margin-bottom:24px;text-align:center}header h1{font-size:1.8rem}header p{opacity:.9}.card{background:#fff;border-radius:14px;padding:20px;margin-bottom:16px;box-shadow:0 2px 8px rgba(0,0,0,.06)}h2{color:var(--c);margin-bottom:12px}button{background:var(--c);color:#fff;border:none;padding:10px 18px;border-radius:8px;cursor:pointer;font-size:1rem}button:hover{filter:brightness(1.1)}input,textarea,select{width:100%;padding:10px 12px;border:1px solid #cbd5e1;border-radius:8px;font-size:1rem;margin-bottom:10px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}.item{background:#f8fafc;border-radius:10px;padding:14px;border-left:4px solid var(--c)}footer{text-align:center;color:#94a3b8;font-size:.8rem;padding:20px;margin-top:30px}.success{color:#16a34a}.hidden{display:none}</style></head><body><header><h1>BrewHouse</h1><p>Coffee</p></header><div class="container"><div class="card"><div id="menu"></div><p>Jami: <strong id="t">$0</strong></p><button onclick="o()" style="width:100%">Buyurtma</button><p id="m" class="hidden success"></p></div></div><footer>Ishlaydigan web-sayt</footer><script>const M=[{n:"Espresso",p:3.5},{n:"Cappuccino",p:4.5},{n:"Flat White",p:4.75},{n:"Croissant",p:3.25}];let c={};function r(){document.getElementById("menu").innerHTML=M.map((x,i)=>`<div style="display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #eee"><span>${x.n} $${x.p}</span><span><button onclick="a(${i})" style="padding:4px 10px">+</button> ${c[i]||0} <button onclick="u(${i})" style="padding:4px 10px">-</button></span></div>`).join("");let t=0;Object.keys(c).forEach(k=>t+=M[k].p*c[k]);document.getElementById("t").textContent="$"+t.toFixed(2)}function a(i){c[i]=(c[i]||0)+1;r()}function u(i){if(c[i]>0){c[i]--;if(!c[i])delete c[i];r()}}function o(){if(!Object.keys(c).length){alert("Tanlang");return}document.getElementById("m").textContent="Qabul qilindi! "+document.getElementById("t").textContent;document.getElementById("m").classList.remove("hidden");c={};r()}r()</script></body></html>
