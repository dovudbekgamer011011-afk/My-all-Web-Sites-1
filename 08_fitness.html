<!DOCTYPE html><html lang="uz"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fitness</title><style>:root{--c:#16a34a}*{margin:0;padding:0;box-sizing:border-box}body{font-family:system-ui,sans-serif;background:#f1f5f9;color:#1e293b;line-height:1.5;min-height:100vh}.container{max-width:900px;margin:0 auto;padding:20px}header{background:var(--c);color:#fff;padding:24px 20px;border-radius:0 0 20px 20px;margin-bottom:24px;text-align:center}header h1{font-size:1.8rem}header p{opacity:.9}.card{background:#fff;border-radius:14px;padding:20px;margin-bottom:16px;box-shadow:0 2px 8px rgba(0,0,0,.06)}h2{color:var(--c);margin-bottom:12px}button{background:var(--c);color:#fff;border:none;padding:10px 18px;border-radius:8px;cursor:pointer;font-size:1rem}button:hover{filter:brightness(1.1)}input,textarea,select{width:100%;padding:10px 12px;border:1px solid #cbd5e1;border-radius:8px;font-size:1rem;margin-bottom:10px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}.item{background:#f8fafc;border-radius:10px;padding:14px;border-left:4px solid var(--c)}footer{text-align:center;color:#94a3b8;font-size:.8rem;padding:20px;margin-top:30px}.success{color:#16a34a}.hidden{display:none}</style></head><body><header><h1>FitTrack</h1><p>Fitness</p></header><div class="container"><div class="card"><select id="w" onchange="load()"><option value="push">Push</option><option value="pull">Pull</option><option value="legs">Legs</option></select><div id="wo"></div><button onclick="done()" style="margin-top:12px">Yakunlash</button><p id="m" class="hidden success"></p></div><div class="card"><div class="grid"><div class="item"><strong id="st">0</strong><br>Seriya</div><div class="item"><strong id="tot">0</strong><br>Jami</div><div class="item"><strong id="cal">0</strong><br>Kal</div></div></div></div><footer>Ishlaydigan web-sayt</footer><script>const W={push:[{n:"Bench",s:"4x8"},{n:"OHP",s:"3x10"}],pull:[{n:"Pullups",s:"4x8"},{n:"Row",s:"3x10"}],legs:[{n:"Squat",s:"4x8"},{n:"Lunges",s:"3x12"}]};let st=JSON.parse(localStorage.getItem("fit")||'{"s":0,"t":0,"c":0}');function load(){document.getElementById("wo").innerHTML=W[document.getElementById("w").value].map(x=>`<div style="padding:8px 0;border-bottom:1px solid #eee">${x.n} — ${x.s}</div>`).join("")}function done(){st.t++;st.s++;st.c+=300;localStorage.setItem("fit",JSON.stringify(st));u();document.getElementById("m").textContent="Saqlandi!";document.getElementById("m").classList.remove("hidden")}function u(){document.getElementById("st").textContent=st.s;document.getElementById("tot").textContent=st.t;document.getElementById("cal").textContent=st.c}load();u()</script></body></html>
