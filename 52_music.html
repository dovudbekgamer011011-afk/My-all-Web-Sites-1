<!DOCTYPE html><html lang="uz"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Music</title><style>:root{--c:#db2777}*{margin:0;padding:0;box-sizing:border-box}body{font-family:system-ui,sans-serif;background:#f1f5f9;color:#1e293b;line-height:1.5;min-height:100vh}.container{max-width:900px;margin:0 auto;padding:20px}header{background:var(--c);color:#fff;padding:24px 20px;border-radius:0 0 20px 20px;margin-bottom:24px;text-align:center}header h1{font-size:1.8rem}header p{opacity:.9}.card{background:#fff;border-radius:14px;padding:20px;margin-bottom:16px;box-shadow:0 2px 8px rgba(0,0,0,.06)}h2{color:var(--c);margin-bottom:12px}button{background:var(--c);color:#fff;border:none;padding:10px 18px;border-radius:8px;cursor:pointer;font-size:1rem}button:hover{filter:brightness(1.1)}input,textarea,select{width:100%;padding:10px 12px;border:1px solid #cbd5e1;border-radius:8px;font-size:1rem;margin-bottom:10px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}.item{background:#f8fafc;border-radius:10px;padding:14px;border-left:4px solid var(--c)}footer{text-align:center;color:#94a3b8;font-size:.8rem;padding:20px;margin-top:30px}.success{color:#16a34a}.hidden{display:none}</style></head><body><header><h1>MelodyBox</h1><p>Musiqa</p></header><div class="container"><div class="card" style="text-align:center"><h2 id="song">—</h2><p id="art" style="color:#64748b"></p><div style="background:#e5e7eb;height:8px;border-radius:4px;margin:16px 0"><div id="pr" style="background:var(--c);height:100%;width:0%"></div></div><p id="tm">0:00</p><button onclick="tog()" id="pp">▶</button> <button onclick="prev()">⏮</button> <button onclick="next()">⏭</button></div><div class="card"><div id="pl"></div></div></div><footer>Ishlaydigan web-sayt</footer><script>const S=[{t:"Midnight City",a:"M83",d:243},{t:"Blinding Lights",a:"Weeknd",d:200},{t:"Bohemian Rhapsody",a:"Queen",d:354}];let i=0,pl=false,sec=0,tm;function load(){document.getElementById("song").textContent=S[i].t;document.getElementById("art").textContent=S[i].a;sec=0;upd();document.getElementById("pl").innerHTML=S.map((s,j)=>`<div style="padding:8px;cursor:pointer;${j===i?"background:#fce7f3":""}" onclick="i=${j};load()">${s.t}</div>`).join("")}function fmt(s){return Math.floor(s/60)+":"+String(s%60).padStart(2,"0")}function upd(){document.getElementById("tm").textContent=fmt(sec)+" / "+fmt(S[i].d);document.getElementById("pr").style.width=(sec/S[i].d*100)+"%"}function play(){pl=true;document.getElementById("pp").textContent="⏸";tm=setInterval(()=>{sec++;if(sec>=S[i].d)next();upd()},1000)}function pause(){pl=false;document.getElementById("pp").textContent="▶";clearInterval(tm)}function tog(){pl?pause():play()}function next(){i=(i+1)%S.length;load();if(pl){pause();play()}}function prev(){i=(i-1+S.length)%S.length;load();if(pl){pause();play()}}load()</script></body></html>
