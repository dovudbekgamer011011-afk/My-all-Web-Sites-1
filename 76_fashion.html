<!DOCTYPE html><html lang="uz"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fashion</title><style>:root{--c:#be185d}*{margin:0;padding:0;box-sizing:border-box}body{font-family:system-ui,sans-serif;background:#f1f5f9;color:#1e293b;line-height:1.5;min-height:100vh}.container{max-width:900px;margin:0 auto;padding:20px}header{background:var(--c);color:#fff;padding:24px 20px;border-radius:0 0 20px 20px;margin-bottom:24px;text-align:center}header h1{font-size:1.8rem}header p{opacity:.9}.card{background:#fff;border-radius:14px;padding:20px;margin-bottom:16px;box-shadow:0 2px 8px rgba(0,0,0,.06)}h2{color:var(--c);margin-bottom:12px}button{background:var(--c);color:#fff;border:none;padding:10px 18px;border-radius:8px;cursor:pointer;font-size:1rem}button:hover{filter:brightness(1.1)}input,textarea,select{width:100%;padding:10px 12px;border:1px solid #cbd5e1;border-radius:8px;font-size:1rem;margin-bottom:10px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}.item{background:#f8fafc;border-radius:10px;padding:14px;border-left:4px solid var(--c)}footer{text-align:center;color:#94a3b8;font-size:.8rem;padding:20px;margin-top:30px}.success{color:#16a34a}.hidden{display:none}</style></head><body><header><h1>StyleHub</h1><p>Moda</p><div>Savat: <span id="c">0</span> · $<span id="t">0</span></div></header><div class="container"><div class="grid" id="items"></div><div class="card"><div id="cart"></div><button onclick="buy()" style="width:100%">Sotib olish</button><p id="m" class="hidden success"></p></div></div><footer>Ishlaydigan web-sayt</footer><script>const I=[{id:1,n:"Palto",p:129},{id:2,n:"Ko'ylak",p:49},{id:3,n:"Etik",p:159},{id:4,n:"Jinsi",p:69}];let cart={};function r(){document.getElementById("items").innerHTML=I.map(x=>`<div class="card"><h3>${x.n}</h3><p style="color:var(--c)">$${x.p}</p><button onclick="add(${x.id})" style="width:100%">Savatga</button></div>`).join("");let c=0,t=0,h="";Object.keys(cart).forEach(id=>{const x=I.find(z=>z.id==id);c+=cart[id];t+=x.p*cart[id];h+=`<div style="display:flex;justify-content:space-between;padding:6px 0">${x.n} x${cart[id]} <span>$${x.p*cart[id]} <button onclick="rm(${id})" style="padding:2px 8px;background:#dc2626">x</button></span></div>`});document.getElementById("cart").innerHTML=h||"<p style=\"color:#94a3b8\">Bo'sh</p>";document.getElementById("c").textContent=c;document.getElementById("t").textContent=t}function add(id){cart[id]=(cart[id]||0)+1;r()}function rm(id){delete cart[id];r()}function buy(){if(!Object.keys(cart).length){alert("Bo'sh");return}document.getElementById("m").textContent="Buyurtma qabul qilindi!";document.getElementById("m").classList.remove("hidden");cart={};r()}r()</script></body></html>
