<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Parol Generator</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',system-ui,sans-serif;min-height:100vh;background:#0f0f13;color:#e8e8ed;line-height:1.5}
.wrap{max-width:720px;margin:0 auto;padding:32px 20px}
.hero{text-align:center;margin-bottom:32px}
.hero h1{font-size:1.85rem;font-weight:700;background:linear-gradient(135deg,#a78bfa,#38bdf8);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:6px}
.hero p{color:#94a3b8;font-size:.95rem}
.card{background:rgba(30,30,40,.85);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.08);border-radius:20px;padding:24px;margin-bottom:20px;box-shadow:0 8px 32px rgba(0,0,0,.3)}
.card h2{font-size:1.1rem;font-weight:600;margin-bottom:16px;color:#f1f5f9}
label{display:block;font-size:.85rem;color:#94a3b8;margin-bottom:6px}
input,select,textarea{width:100%;padding:12px 14px;border-radius:12px;border:1px solid rgba(255,255,255,.1);background:rgba(15,15,20,.6);color:#f1f5f9;font-size:1rem;margin-bottom:14px;outline:none;transition:border .2s}
input:focus,select:focus,textarea:focus{border-color:#a78bfa}
button{background:linear-gradient(135deg,#7c3aed,#2563eb);color:#fff;border:none;padding:12px 20px;border-radius:12px;font-size:1rem;font-weight:600;cursor:pointer;transition:transform .15s,box-shadow .15s}
button:hover{transform:translateY(-1px);box-shadow:0 6px 20px rgba(124,58,237,.4)}
button.secondary{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12)}
button.danger{background:linear-gradient(135deg,#dc2626,#b91c1c)}
.row{display:flex;gap:12px;flex-wrap:wrap}
.row>*{flex:1;min-width:120px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px}
.pill{display:inline-block;padding:4px 12px;border-radius:999px;font-size:.8rem;background:rgba(167,139,250,.15);color:#c4b5fd}
.muted{color:#94a3b8;font-size:.9rem}
.success{color:#4ade80}
.result{font-size:2rem;font-weight:700;text-align:center;padding:16px;word-break:break-all}
footer{text-align:center;color:#64748b;font-size:.8rem;margin-top:40px}

</style>
</head>
<body>
<div class="wrap">

<div class="hero"><h1>🔐 Parol Generator</h1><p>Kuchli va xavfsiz parol yarating</p></div>
<div class="card">
  <label>Uzunlik: <span id="lenVal">16</span></label>
  <input type="range" id="len" min="8" max="64" value="16" oninput="document.getElementById('lenVal').textContent=this.value;gen()">
  <div class="row" style="margin:16px 0">
    <label style="display:flex;align-items:center;gap:8px;cursor:pointer"><input type="checkbox" id="upper" checked style="width:auto;margin:0"> A-Z</label>
    <label style="display:flex;align-items:center;gap:8px;cursor:pointer"><input type="checkbox" id="lower" checked style="width:auto;margin:0"> a-z</label>
    <label style="display:flex;align-items:center;gap:8px;cursor:pointer"><input type="checkbox" id="num" checked style="width:auto;margin:0"> 0-9</label>
    <label style="display:flex;align-items:center;gap:8px;cursor:pointer"><input type="checkbox" id="sym" checked style="width:auto;margin:0"> !@#</label>
  </div>
  <div class="result" id="pass" style="background:rgba(0,0,0,.3);border-radius:12px;font-size:1.3rem;letter-spacing:1px;margin:16px 0;min-height:56px;display:flex;align-items:center;justify-content:center"></div>
  <div class="row">
    <button onclick="gen()" style="flex:1">Yangi parol</button>
    <button class="secondary" onclick="copyPass()" style="flex:1">Nusxa olish</button>
  </div>
  <p id="msg" class="muted" style="text-align:center;margin-top:12px"></p>
</div>

<footer>Ishlaydigan web-sayt · HTML + CSS + JS</footer>
</div>
<script>
function gen(){
  const len=+document.getElementById('len').value;
  let chars='';
  if(document.getElementById('upper').checked) chars+='ABCDEFGHIJKLMNOPQRSTUVWXYZ';
  if(document.getElementById('lower').checked) chars+='abcdefghijklmnopqrstuvwxyz';
  if(document.getElementById('num').checked) chars+='0123456789';
  if(document.getElementById('sym').checked) chars+='!@#$%^&*()_+-=[]{}|;:,.<>?';
  if(!chars){document.getElementById('pass').textContent='Belgi tanlang';return}
  let p='';
  const arr=new Uint32Array(len);
  crypto.getRandomValues(arr);
  for(let i=0;i<len;i++) p+=chars[arr[i]%chars.length];
  document.getElementById('pass').textContent=p;
  document.getElementById('msg').textContent='';
}
function copyPass(){
  const t=document.getElementById('pass').textContent;
  if(!t||t==='Belgi tanlang')return;
  navigator.clipboard.writeText(t).then(()=>{document.getElementById('msg').textContent='✓ Nusxa olindi';document.getElementById('msg').className='success'});
}
gen();
['upper','lower','num','sym'].forEach(id=>document.getElementById(id).onchange=gen);
</script>
</body>
</html>
