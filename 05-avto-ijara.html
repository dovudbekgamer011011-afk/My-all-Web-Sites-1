<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AvtoIjar - Avtomobil ijarasi</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body class="bg-slate-50 text-gray-800">
    <header class="bg-white shadow-sm sticky top-0 z-50">
        <div class="max-w-6xl mx-auto px-4 py-4 flex justify-between items-center">
            <div class="flex items-center gap-2 cursor-pointer" onclick="showPage('home')">
                <i class="fas fa-car text-sky-600 text-2xl"></i>
                <span class="text-xl font-bold text-sky-600">AvtoIjar</span>
            </div>
            <button onclick="showPage('book')" class="bg-sky-600 text-white px-4 py-2 rounded-lg text-sm font-medium hover:bg-sky-700">
                Bron qilish
            </button>
        </div>
    </header>

    <div id="page-home">
        <section class="bg-gradient-to-r from-sky-600 to-blue-800 text-white py-16">
            <div class="max-w-6xl mx-auto px-4 text-center">
                <h1 class="text-4xl md:text-5xl font-bold mb-4">Kunlik va haftalik avtomobil ijarasi</h1>
                <p class="text-xl text-sky-100 mb-8">Qulay va ishonchli mashinalar</p>
                <div class="bg-white rounded-xl p-4 max-w-3xl mx-auto flex flex-col md:flex-row gap-3">
                    <input id="searchCity" type="text" placeholder="Shahar" class="flex-1 px-4 py-3 rounded-lg text-gray-800 border">
                    <input id="searchFrom" type="date" class="flex-1 px-4 py-3 rounded-lg text-gray-800 border">
                    <input id="searchTo" type="date" class="flex-1 px-4 py-3 rounded-lg text-gray-800 border">
                    <button onclick="searchCars()" class="bg-sky-600 text-white px-6 py-3 rounded-lg font-semibold hover:bg-sky-700">
                        Qidirish
                    </button>
                </div>
            </div>
        </section>

        <section class="py-12">
            <div class="max-w-6xl mx-auto px-4">
                <div class="flex justify-between items-center mb-6">
                    <h2 class="text-2xl font-bold">Mavjud avtomobillar</h2>
                    <select id="classFilter" onchange="applyFilter()" class="px-3 py-2 border rounded-lg text-sm">
                        <option value="">Barcha sinflar</option>
                        <option value="Ekonom">Ekonom</option>
                        <option value="Biznes">Biznes</option>
                        <option value="Krossover">Krossover</option>
                    </select>
                </div>
                <div id="carsList" class="grid sm:grid-cols-2 md:grid-cols-3 gap-6"></div>
            </div>
        </section>
    </div>

    <div id="page-book" class="hidden">
        <section class="py-10">
            <div class="max-w-xl mx-auto px-4">
                <h2 class="text-2xl font-bold mb-6 text-center">Avtomobil bron qilish</h2>
                <form id="bookForm" onsubmit="submitBook(event)" class="bg-white p-6 rounded-2xl shadow-sm space-y-4">
                    <div>
                        <label class="block text-sm font-medium mb-1">Ismingiz</label>
                        <input type="text" id="bName" required class="w-full px-4 py-2 border rounded-lg">
                    </div>
                    <div>
                        <label class="block text-sm font-medium mb-1">Telefon</label>
                        <input type="tel" id="bPhone" required class="w-full px-4 py-2 border rounded-lg">
                    </div>
                    <div>
                        <label class="block text-sm font-medium mb-1">Avtomobil</label>
                        <select id="bCar" required class="w-full px-4 py-2 border rounded-lg">
                            <option value="">Tanlang</option>
                        </select>
                    </div>
                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <label class="block text-sm font-medium mb-1">Olish sanasi</label>
                            <input type="date" id="bFrom" required class="w-full px-4 py-2 border rounded-lg">
                        </div>
                        <div>
                            <label class="block text-sm font-medium mb-1">Qaytarish</label>
                            <input type="date" id="bTo" required class="w-full px-4 py-2 border rounded-lg">
                        </div>
                    </div>
                    <button type="submit" class="w-full bg-sky-600 text-white py-3 rounded-lg font-semibold hover:bg-sky-700">Bron qilish</button>
                </form>
                <div id="bookSuccess" class="hidden mt-6 bg-green-50 border border-green-200 text-green-800 p-4 rounded-xl text-center">
                    <i class="fas fa-check-circle text-2xl mb-2"></i>
                    <p class="font-semibold">Bron muvaffaqiyatli!</p>
                    <p class="text-sm mt-1">Operator siz bilan bog‘lanadi.</p>
                </div>
            </div>
        </section>
    </div>

    <div id="modal" class="hidden fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl max-w-md w-full p-6 relative">
            <button onclick="closeModal()" class="absolute top-4 right-4 text-gray-400"><i class="fas fa-times"></i></button>
            <div id="modalContent"></div>
        </div>
    </div>

    <footer class="bg-gray-900 text-gray-400 py-6 text-center text-sm mt-10">
        <p>© 2026 AvtoIjar</p>
    </footer>

    <script>
        const cars = [
            {id:1, name:"Chevrolet Cobalt", class:"Ekonom", price:350000, seats:5, transmission:"Avtomat", year:2022},
            {id:2, name:"Kia Rio", class:"Ekonom", price:320000, seats:5, transmission:"Mexanika", year:2021},
            {id:3, name:"Toyota Camry", class:"Biznes", price:700000, seats:5, transmission:"Avtomat", year:2023},
            {id:4, name:"Hyundai Sonata", class:"Biznes", price:650000, seats:5, transmission:"Avtomat", year:2022},
            {id:5, name:"Hyundai Tucson", class:"Krossover", price:900000, seats:5, transmission:"Avtomat", year:2023},
            {id:6, name:"Kia Sportage", class:"Krossover", price:850000, seats:5, transmission:"Avtomat", year:2022}
        ];
        let filtered = [...cars];

        function showPage(p) {
            document.getElementById('page-home').classList.add('hidden');
            document.getElementById('page-book').classList.add('hidden');
            document.getElementById('page-'+p).classList.remove('hidden');
            if(p==='book') {
                bookForm.classList.remove('hidden');
                bookSuccess.classList.add('hidden');
                bCar.innerHTML = '<option value="">Tanlang</option>' + cars.map(c => `<option value="${c.name}">${c.name} — ${c.price.toLocaleString()} so'm/kun</option>`).join('');
            }
        }

        function renderCars(list) {
            const c = document.getElementById('carsList');
            if(!list.length){ c.innerHTML='<p class="col-span-full text-center text-gray-500 py-10">Topilmadi</p>'; return; }
            c.innerHTML = list.map(car => `
                <div class="bg-white rounded-2xl shadow-sm overflow-hidden hover:shadow-md transition">
                    <div class="h-36 bg-gradient-to-br from-gray-200 to-gray-300 flex items-center justify-center">
                        <i class="fas fa-car text-5xl text-gray-400"></i>
                    </div>
                    <div class="p-5">
                        <h3 class="font-bold text-lg">${car.name}</h3>
                        <p class="text-gray-500 text-sm mb-2">${car.class} • ${car.transmission} • ${car.year}</p>
                        <p class="text-sky-600 font-bold text-xl mb-3">${car.price.toLocaleString()} so'm<span class="text-sm font-normal text-gray-500">/kun</span></p>
                        <div class="flex gap-2">
                            <button onclick="showCar(${car.id})" class="flex-1 bg-sky-50 text-sky-700 py-2 rounded-lg text-sm font-medium">Batafsil</button>
                            <button onclick="bookCar('${car.name}')" class="flex-1 bg-sky-600 text-white py-2 rounded-lg text-sm font-medium">Bron</button>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function showCar(id) {
            const car = cars.find(c=>c.id===id);
            modalContent.innerHTML = `
                <h3 class="text-xl font-bold mb-2">${car.name}</h3>
                <p class="text-sky-600 mb-4">${car.class}</p>
                <p class="text-sm mb-1">Narx: <b>${car.price.toLocaleString()} so'm/kun</b></p>
                <p class="text-sm mb-1">O‘rindiqlar: ${car.seats}</p>
                <p class="text-sm mb-1">Uzatma: ${car.transmission}</p>
                <p class="text-sm mb-4">Yili: ${car.year}</p>
                <button onclick="bookCar('${car.name}');closeModal()" class="w-full bg-sky-600 text-white py-3 rounded-lg font-semibold">Bron qilish</button>
            `;
            modal.classList.remove('hidden');
        }
        function closeModal(){ modal.classList.add('hidden'); }

        function bookCar(name) {
            showPage('book');
            bCar.value = name;
        }

        function searchCars() {
            applyFilter();
        }

        function applyFilter() {
            const cls = classFilter.value;
            filtered = cls ? cars.filter(c => c.class === cls) : [...cars];
            renderCars(filtered);
        }

        function submitBook(e) {
            e.preventDefault();
            const data = {
                name: bName.value, phone: bPhone.value, car: bCar.value,
                from: bFrom.value, to: bTo.value,
                created: new Date().toLocaleString('uz-UZ')
            };
            let list = JSON.parse(localStorage.getItem('avtoijar_books')||'[]');
            list.push(data);
            localStorage.setItem('avtoijar_books', JSON.stringify(list));
            bookForm.classList.add('hidden');
            bookSuccess.classList.remove('hidden');
            bookForm.reset();
        }

        renderCars(cars);
    </script>
</body>
</html>
