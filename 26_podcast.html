<!DOCTYPE html><html lang="uz"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Podcast</title><style>:root{--c:#9333ea}*{margin:0;padding:0;box-sizing:border-box}body{font-family:system-ui,sans-serif;background:#f1f5f9;color:#1e293b;line-height:1.5;min-height:100vh}.container{max-width:900px;margin:0 auto;padding:20px}header{background:var(--c);color:#fff;padding:24px 20px;border-radius:0 0 20px 20px;margin-bottom:24px;text-align:center}header h1{font-size:1.8rem}header p{opacity:.9}.card{background:#fff;border-radius:14px;padding:20px;margin-bottom:16px;box-shadow:0 2px 8px rgba(0,0,0,.06)}h2{color:var(--c);margin-bottom:12px}button{background:var(--c);color:#fff;border:none;padding:10px 18px;border-radius:8px;cursor:pointer;font-size:1rem}button:hover{filter:brightness(1.1)}input,textarea,select{width:100%;padding:10px 12px;border:1px solid #cbd5e1;border-radius:8px;font-size:1rem;margin-bottom:10px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}.item{background:#f8fafc;border-radius:10px;padding:14px;border-left:4px solid var(--c)}footer{text-align:center;color:#94a3b8;font-size:.8rem;padding:20px;margin-top:30px}.success{color:#16a34a}.hidden{display:none}</style></head><body><header><h1>SoundWave</h1><p>Podcast</p></header><div class="container"><div class="card" style="text-align:center"><h2 id="title">—</h2><div style="background:#e5e7eb;height:8px;border-radius:4px;margin:16px 0"><div id="pr" style="background:var(--c);height:100%;width:0%"></div></div><p id="tm">0:00</p><button onclick="tog()" id="pp">▶ Play</button></div><div class="card"><div id="list"></div></div></div><footer>Ishlaydigan web-sayt</footer><script>const E=[{t:"AI kelajagi",d:45},{t:"Startup",d:32},{t:"Ongli hayot",d:28}];let i=0,pl=false,sec=0,tm;function load(){document.getElementById("title").textContent=E[i].t;sec=0;upd();document.getElementById("list").innerHTML=E.map((e,j)=>`<div style="padding:10px;cursor:pointer;${j===i?"background:#f3e8ff":""}" onclick="i=${j};load()">${e.t} (${e.d} daq)</div>`).join("")}function upd(){const tot=E[i].d*60;document.getElementById("tm").textContent=Math.floor(sec/60)+":"+String(sec%60).padStart(2,"0")+" / "+E[i].d+":00";document.getElementById("pr").style.width=(sec/tot*100)+"%"}function play(){pl=true;document.getElementById("pp").textContent="⏸";tm=setInterval(()=>{sec++;if(sec>=E[i].d*60){sec=0;pause()}upd()},1000)}function pause(){pl=false;document.getElementById("pp").textContent="▶ Play";clearInterval(tm)}function tog(){pl?pause():play()}load()</script></body></html>
