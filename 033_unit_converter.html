<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Konverter</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',system-ui,sans-serif;min-height:100vh;background:#0f0f13;color:#e8e8ed;line-height:1.5}
.wrap{max-width:720px;margin:0 auto;padding:32px 20px}
.hero{text-align:center;margin-bottom:32px}
.hero h1{font-size:1.85rem;font-weight:700;background:linear-gradient(135deg,#a78bfa,#38bdf8);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:6px}
.hero p{color:#94a3b8;font-size:.95rem}
.card{background:rgba(30,30,40,.85);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.08);border-radius:20px;padding:24px;margin-bottom:20px;box-shadow:0 8px 32px rgba(0,0,0,.3)}
.card h2{font-size:1.1rem;font-weight:600;margin-bottom:16px;color:#f1f5f9}
label{display:block;font-size:.85rem;color:#94a3b8;margin-bottom:6px}
input,select,textarea{width:100%;padding:12px 14px;border-radius:12px;border:1px solid rgba(255,255,255,.1);background:rgba(15,15,20,.6);color:#f1f5f9;font-size:1rem;margin-bottom:14px;outline:none;transition:border .2s}
input:focus,select:focus,textarea:focus{border-color:#a78bfa}
button{background:linear-gradient(135deg,#7c3aed,#2563eb);color:#fff;border:none;padding:12px 20px;border-radius:12px;font-size:1rem;font-weight:600;cursor:pointer;transition:transform .15s,box-shadow .15s}
button:hover{transform:translateY(-1px);box-shadow:0 6px 20px rgba(124,58,237,.4)}
button.secondary{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12)}
button.danger{background:linear-gradient(135deg,#dc2626,#b91c1c)}
.row{display:flex;gap:12px;flex-wrap:wrap}
.row>*{flex:1;min-width:120px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px}
.pill{display:inline-block;padding:4px 12px;border-radius:999px;font-size:.8rem;background:rgba(167,139,250,.15);color:#c4b5fd}
.muted{color:#94a3b8;font-size:.9rem}
.success{color:#4ade80}
.result{font-size:2rem;font-weight:700;text-align:center;padding:16px;word-break:break-all}
footer{text-align:center;color:#64748b;font-size:.8rem;margin-top:40px}

</style>
</head>
<body>
<div class="wrap">

<div class="hero"><h1>📐 Birlik Konverter</h1><p>Uzunlik, og'irlik, temperatura</p></div>
<div class="card">
  <label>Tur</label>
  <select id="type" onchange="updateUnits()">
    <option value="length">Uzunlik</option>
    <option value="weight">Og'irlik</option>
    <option value="temp">Temperatura</option>
  </select>
  <div class="row">
    <div><label>Qiymat</label><input type="number" id="fromVal" value="1" oninput="convert()"></div>
    <div><label>Dan</label><select id="fromUnit" onchange="convert()"></select></div>
  </div>
  <div class="row">
    <div><label>Natija</label><input type="text" id="toVal" readonly style="font-weight:700;color:#a78bfa"></div>
    <div><label>Ga</label><select id="toUnit" onchange="convert()"></select></div>
  </div>
</div>

<footer>Ishlaydigan web-sayt · HTML + CSS + JS</footer>
</div>
<script>
const units={
  length:{m:1,km:0.001,cm:100,mm:1000,mi:0.000621371,ft:3.28084,in:39.3701},
  weight:{kg:1,g:1000,mg:1000000,lb:2.20462,oz:35.274},
  temp:{C:1,F:1,K:1}
};
function updateUnits(){
  const t=document.getElementById('type').value;
  const opts=Object.keys(units[t]).map(u=>`<option value="${u}">${u}</option>`).join('');
  document.getElementById('fromUnit').innerHTML=opts;
  document.getElementById('toUnit').innerHTML=opts;
  document.getElementById('toUnit').selectedIndex=1;
  convert();
}
function convert(){
  const t=document.getElementById('type').value;
  const val=+document.getElementById('fromVal').value||0;
  const from=document.getElementById('fromUnit').value;
  const to=document.getElementById('toUnit').value;
  let result;
  if(t==='temp'){
    let c=val;
    if(from==='F')c=(val-32)*5/9;
    if(from==='K')c=val-273.15;
    if(to==='C')result=c;
    else if(to==='F')result=c*9/5+32;
    else result=c+273.15;
  }else{
    const base=val/units[t][from]* (from===Object.keys(units[t])[0]?1:1);
    // convert to base (first unit = base factor inverted)
    const toBase = val / units[t][from] * units[t][Object.keys(units[t])[0]] / units[t][Object.keys(units[t])[0]];
    // simpler: all relative to first key as reference with factor
    const ref = Object.keys(units[t])[0];
    const inRef = val / units[t][from] * units[t][ref];
    // wait, factors are "how many of this in 1 ref"
    // kg=1 means 1kg = 1kg, g=1000 means 1kg = 1000g
    // so val_in_ref = val / factor[from]  if factor is "units per ref"
    // Actually: value_in_kg = value_in_g / 1000 = val / units.weight.g
    result = (val / units[t][from]) * units[t][to];
  }
  document.getElementById('toVal').value=Number(result.toPrecision(8));
}
updateUnits();
</script>
</body>
</html>
