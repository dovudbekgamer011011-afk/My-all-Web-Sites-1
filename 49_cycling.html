<!DOCTYPE html><html lang="uz"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cycling</title><style>:root{--c:#15803d}*{margin:0;padding:0;box-sizing:border-box}body{font-family:system-ui,sans-serif;background:#f1f5f9;color:#1e293b;line-height:1.5;min-height:100vh}.container{max-width:900px;margin:0 auto;padding:20px}header{background:var(--c);color:#fff;padding:24px 20px;border-radius:0 0 20px 20px;margin-bottom:24px;text-align:center}header h1{font-size:1.8rem}header p{opacity:.9}.card{background:#fff;border-radius:14px;padding:20px;margin-bottom:16px;box-shadow:0 2px 8px rgba(0,0,0,.06)}h2{color:var(--c);margin-bottom:12px}button{background:var(--c);color:#fff;border:none;padding:10px 18px;border-radius:8px;cursor:pointer;font-size:1rem}button:hover{filter:brightness(1.1)}input,textarea,select{width:100%;padding:10px 12px;border:1px solid #cbd5e1;border-radius:8px;font-size:1rem;margin-bottom:10px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}.item{background:#f8fafc;border-radius:10px;padding:14px;border-left:4px solid var(--c)}footer{text-align:center;color:#94a3b8;font-size:.8rem;padding:20px;margin-top:30px}.success{color:#16a34a}.hidden{display:none}</style></head><body><header><h1>PedalPath</h1><p>Velosiped</p></header><div class="container"><div class="card"><select id="df" onchange="f()"><option value="all">Barcha</option><option>Oson</option><option>O'rtacha</option><option>Qiyin</option></select></div><div id="rt"></div><div class="card"><input id="km" type="number" placeholder="Km"><button onclick="log()" style="width:100%;margin-top:4px">Yozish</button><p>Jami: <strong id="tot">0</strong> km</p><div id="rd"></div></div></div><footer>Ishlaydigan web-sayt</footer><script>let rd=JSON.parse(localStorage.getItem("rides")||"[]");const R=[{n:"Shahar",d:"Oson",k:12},{n:"Tepalik",d:"Qiyin",k:28},{n:"Ko'l",d:"O'rtacha",k:18}];function f(){const d=document.getElementById("df").value;document.getElementById("rt").innerHTML=R.filter(x=>d==="all"||x.d===d).map(x=>`<div class="card"><h3>${x.n}</h3><p>${x.d} · ${x.k} km</p></div>`).join("")}function log(){const k=+document.getElementById("km").value;if(!k)return;rd.unshift({d:new Date().toLocaleDateString("uz"),k});localStorage.setItem("rides",JSON.stringify(rd));document.getElementById("km").value="";rr()}function rr(){document.getElementById("tot").textContent=rd.reduce((s,x)=>s+x.k,0);document.getElementById("rd").innerHTML=rd.slice(0,5).map(x=>`<div class="item">${x.d}: ${x.k} km</div>`).join("")}f();rr()</script></body></html>
