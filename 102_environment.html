<!DOCTYPE html><html lang="uz"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Eco</title><style>:root{--c:#166534}*{margin:0;padding:0;box-sizing:border-box}body{font-family:system-ui,sans-serif;background:#f1f5f9;color:#1e293b;line-height:1.5;min-height:100vh}.container{max-width:900px;margin:0 auto;padding:20px}header{background:var(--c);color:#fff;padding:24px 20px;border-radius:0 0 20px 20px;margin-bottom:24px;text-align:center}header h1{font-size:1.8rem}header p{opacity:.9}.card{background:#fff;border-radius:14px;padding:20px;margin-bottom:16px;box-shadow:0 2px 8px rgba(0,0,0,.06)}h2{color:var(--c);margin-bottom:12px}button{background:var(--c);color:#fff;border:none;padding:10px 18px;border-radius:8px;cursor:pointer;font-size:1rem}button:hover{filter:brightness(1.1)}input,textarea,select{width:100%;padding:10px 12px;border:1px solid #cbd5e1;border-radius:8px;font-size:1rem;margin-bottom:10px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}.item{background:#f8fafc;border-radius:10px;padding:14px;border-left:4px solid var(--c)}footer{text-align:center;color:#94a3b8;font-size:.8rem;padding:20px;margin-top:30px}.success{color:#16a34a}.hidden{display:none}</style></head><body><header><h1>EcoAction</h1><p>Ekologiya</p></header><div class="container"><div class="card"><div id="ac"></div></div><div class="card"><p><strong id="dn">0</strong> / <span id="tt">0</span></p><div style="background:#e5e7eb;height:12px;border-radius:6px;margin:12px 0"><div id="bar" style="background:var(--c);height:100%;width:0%;border-radius:6px"></div></div></div></div><footer>Ishlaydigan web-sayt</footer><script>let ch=JSON.parse(localStorage.getItem("eco")||"[]");const A=["Plastmassani kamaytirish","Jamoat transporti","Mahalliy oziq-ovqat","Energiya tejash","Chiqlarni ajratish","Daraxt ekish"];function r(){document.getElementById("ac").innerHTML=A.map((a,i)=>`<label style="display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid #eee"><input type="checkbox" ${ch.includes(i)?"checked":""} onchange="tog(${i},this.checked)"> ${a}</label>`).join("");document.getElementById("dn").textContent=ch.length;document.getElementById("tt").textContent=A.length;document.getElementById("bar").style.width=(ch.length/A.length*100)+"%"}function tog(i,on){if(on)ch.push(i);else ch=ch.filter(x=>x!==i);localStorage.setItem("eco",JSON.stringify(ch));r()}r()</script></body></html>
