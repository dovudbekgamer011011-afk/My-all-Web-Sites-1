<!DOCTYPE html><html lang="uz"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nonprofit</title><style>:root{--c:#be123c}*{margin:0;padding:0;box-sizing:border-box}body{font-family:system-ui,sans-serif;background:#f1f5f9;color:#1e293b;line-height:1.5;min-height:100vh}.container{max-width:900px;margin:0 auto;padding:20px}header{background:var(--c);color:#fff;padding:24px 20px;border-radius:0 0 20px 20px;margin-bottom:24px;text-align:center}header h1{font-size:1.8rem}header p{opacity:.9}.card{background:#fff;border-radius:14px;padding:20px;margin-bottom:16px;box-shadow:0 2px 8px rgba(0,0,0,.06)}h2{color:var(--c);margin-bottom:12px}button{background:var(--c);color:#fff;border:none;padding:10px 18px;border-radius:8px;cursor:pointer;font-size:1rem}button:hover{filter:brightness(1.1)}input,textarea,select{width:100%;padding:10px 12px;border:1px solid #cbd5e1;border-radius:8px;font-size:1rem;margin-bottom:10px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}.item{background:#f8fafc;border-radius:10px;padding:14px;border-left:4px solid var(--c)}footer{text-align:center;color:#94a3b8;font-size:.8rem;padding:20px;margin-top:30px}.success{color:#16a34a}.hidden{display:none}</style></head><body><header><h1>HopeBridge</h1><p>Xayriya</p></header><div class="container"><div class="card"><h2>Missiya</h2><p>Ta'lim va toza suv.</p></div><div class="card"><div class="grid"><div class="item"><strong style="font-size:1.8rem">14</strong><br>Maktab</div><div class="item"><strong style="font-size:1.8rem">3200</strong><br>Bolalar</div><div class="item"><strong style="font-size:1.8rem">28</strong><br>Quvur</div></div></div><div class="card"><select id="amt"><option value="10">$10</option><option value="25">$25</option><option value="50">$50</option><option value="100">$100</option></select><input id="nm" placeholder="Ism"><button onclick="don()" style="width:100%">Xayriya</button><p id="m" class="hidden success"></p></div></div><footer>Ishlaydigan web-sayt</footer><script>function don(){const n=document.getElementById("nm").value||"Anonim";document.getElementById("m").textContent="Rahmat, "+n+"! $"+document.getElementById("amt").value+" qabul qilindi.";document.getElementById("m").classList.remove("hidden")}</script></body></html>
