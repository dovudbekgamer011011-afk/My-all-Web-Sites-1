<!DOCTYPE html><html lang="uz"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Crypto</title><style>:root{--c:#f59e0b}*{margin:0;padding:0;box-sizing:border-box}body{font-family:system-ui,sans-serif;background:#f1f5f9;color:#1e293b;line-height:1.5;min-height:100vh}.container{max-width:900px;margin:0 auto;padding:20px}header{background:var(--c);color:#fff;padding:24px 20px;border-radius:0 0 20px 20px;margin-bottom:24px;text-align:center}header h1{font-size:1.8rem}header p{opacity:.9}.card{background:#fff;border-radius:14px;padding:20px;margin-bottom:16px;box-shadow:0 2px 8px rgba(0,0,0,.06)}h2{color:var(--c);margin-bottom:12px}button{background:var(--c);color:#fff;border:none;padding:10px 18px;border-radius:8px;cursor:pointer;font-size:1rem}button:hover{filter:brightness(1.1)}input,textarea,select{width:100%;padding:10px 12px;border:1px solid #cbd5e1;border-radius:8px;font-size:1rem;margin-bottom:10px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}.item{background:#f8fafc;border-radius:10px;padding:14px;border-left:4px solid var(--c)}footer{text-align:center;color:#94a3b8;font-size:.8rem;padding:20px;margin-top:30px}.success{color:#16a34a}.hidden{display:none}</style></head><body><header><h1>CoinWatch</h1><p>Kripto</p></header><div class="container"><div class="card"><input id="coin" placeholder="BTC, ETH..."><input id="amt" type="number" step="0.0001" placeholder="Miqdor"><button onclick="add()" style="width:100%">Qo'shish</button></div><div class="card"><div id="pr"></div></div><div class="card"><div id="pf"></div><p>Jami: <strong id="tot">$0</strong></p></div></div><footer>Ishlaydigan web-sayt</footer><script>const PR={BTC:68420,ETH:3210,SOL:148,BNB:580};let pf=JSON.parse(localStorage.getItem("crypto")||"{}");function r(){document.getElementById("pr").innerHTML=Object.keys(PR).map(c=>`<div class="item"><strong>${c}</strong> $${PR[c].toLocaleString()}</div>`).join("");let t=0,h="";Object.keys(pf).forEach(c=>{const v=pf[c]*PR[c];t+=v;h+=`<div style="display:flex;justify-content:space-between;padding:8px 0">${c}: ${pf[c]} <span>$${v.toFixed(2)} <button onclick="del('${c}')" style="padding:2px 8px;background:#dc2626">x</button></span></div>`});document.getElementById("pf").innerHTML=h||"<p style=\"color:#94a3b8\">Bo'sh</p>";document.getElementById("tot").textContent="$"+t.toFixed(2);localStorage.setItem("crypto",JSON.stringify(pf))}function add(){const c=document.getElementById("coin").value.toUpperCase();const a=+document.getElementById("amt").value;if(!PR[c]||!a){alert("Noto'g'ri");return}pf[c]=(pf[c]||0)+a;document.getElementById("coin").value="";document.getElementById("amt").value="";r()}function del(c){delete pf[c];r()}r()</script></body></html>
