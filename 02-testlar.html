<!doctype html><html lang=uz><meta charset=utf-8><meta name=viewport content='width=device-width,initial-scale=1'><title>Imtihon testlari</title><style>:root{--a:#8b5cf6;--b:#ec4899}:root{--bg:#f4f5fb;--c:#fff;--t:#1c2033;--m:#6c7293;--l:#e4e7f3}@media(prefers-color-scheme:dark){:root{--bg:#0f1224;--c:#181c36;--t:#eceeff;--m:#9aa0c8;--l:#2a2f55}}*{box-sizing:border-box}body{margin:0;font:15px/1.5 system-ui,sans-serif;background:var(--bg);color:var(--t)}header{background:linear-gradient(135deg,var(--a),var(--b));color:#fff;padding:26px 18px 40px}header h1{margin:0;font-size:26px}header p{margin:4px 0 0;opacity:.85}main{max-width:760px;margin:-22px auto 30px;padding:0 14px;display:grid;gap:14px}.k{background:var(--c);border:1px solid var(--l);border-radius:18px;padding:16px;box-shadow:0 8px 24px rgba(30,40,100,.08)}input,select,textarea{font:inherit;color:var(--t);background:var(--bg);border:1px solid var(--l);border-radius:12px;padding:10px 12px;width:100%;outline:0}input:focus,select:focus,textarea:focus{border-color:var(--a)}button{font:inherit;border:0;border-radius:12px;padding:9px 13px;background:var(--a);color:#fff;font-weight:600;cursor:pointer}button.g{background:var(--bg);color:var(--t);border:1px solid var(--l)}.r{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}.s{text-align:center}.s b{display:block;font-size:26px;color:var(--a)}.s small{color:var(--m)}table{width:100%;border-collapse:collapse}td,th{padding:8px;border-bottom:1px solid var(--l);text-align:left}.i{border:1px solid var(--l);border-radius:14px;padding:12px;margin:8px 0}</style><header><h1>Imtihon testlari</h1><p>O'z testingni tuz, vaqt bilan yech va xatolaringni ko'r</p></header><main>
<div class=k id=lst></div>
<div class=k id=qz style="display:none"></div>
<div class=k><b>Yangi test</b><input id=tn placeholder="Test nomi" style="margin:8px 0"><textarea id=tq rows=6 placeholder="Har qatorda bitta savol:&#10;Savol | to'g'ri javob | noto'g'ri 1 | noto'g'ri 2 | noto'g'ri 3"></textarea><button onclick=mk() style="margin-top:8px">Saqlash</button></div>
<script>let T=JSON.parse(localStorage.tst||'null')||[{n:"Umumiy bilim",q:[["O'zbekiston poytaxti?","Toshkent","Samarqand","Buxoro","Xiva"],["2+2*2 nechaga teng?","6","8","4","10"],["Suv formulasi?","H2O","CO2","O2","NaCl"],["Eng katta sayyora?","Yupiter","Mars","Yer","Venera"]]}];
const sh=a=>a.map(x=>[Math.random(),x]).sort((a,b)=>a[0]-b[0]).map(x=>x[1]);let run,cur,iv;
function sv(){localStorage.tst=JSON.stringify(T);L()}
function L(){lst.innerHTML='<b>Testlar</b>'+T.map((t,i)=>`<div class=i style="display:flex;gap:8px;align-items:center"><div style="flex:1"><b>${t.n}</b><br><small style="color:var(--m)">${t.q.length} savol · eng yaxshi: ${localStorage['b'+t.n]||'—'}</small></div><button onclick=go(${i})>Boshlash</button><button class=g onclick="confirm('O\'chirilsinmi?')&&(T.splice(${i},1),sv())">✕</button></div>`).join('')}
function mk(){let q=tq.value.split('\n').map(l=>l.split('|').map(x=>x.trim())).filter(a=>a.length>=3&&a[0]);if(!tn.value||!q.length)return alert("Nom va kamida bitta savol kerak (kamida 2 ta javob variantli)");T.push({n:tn.value,q});tn.value=tq.value='';sv()}
function go(i){run={n:T[i].n,qs:sh(T[i].q),i:0,sc:0,wr:[]};qz.style.display='';Q()}
function Q(){clearInterval(iv);if(run.i>=run.qs.length)return fin();let q=run.qs[run.i],t=20;cur=sh(q.slice(1));
qz.innerHTML=`<div style="display:flex;justify-content:space-between"><b>Savol ${run.i+1}/${run.qs.length}</b><b id=tm style="color:var(--a)">${t}s</b></div><h3>${q[0]}</h3>`+cur.map((o,k)=>`<button class=g id=o${k} style="display:block;width:100%;text-align:left;margin:6px 0" onclick=ans(${k})>${o}</button>`).join('');
iv=setInterval(()=>{t--;tm.textContent=t+'s';if(t<=0)ans(-1)},1000)}
function ans(k){clearInterval(iv);let q=run.qs[run.i],ok=cur[k]==q[1];if(ok)run.sc++;else run.wr.push([q[0],q[1],cur[k]||'— (vaqt tugadi)']);
cur.forEach((o,j)=>{let b=document.getElementById('o'+j);b.disabled=true;if(o==q[1])b.style.cssText+=';background:#16a34a;color:#fff';else if(j==k)b.style.cssText+=';background:#e11d48;color:#fff'});setTimeout(()=>{run.i++;Q()},900)}
function fin(){let p=Math.round(run.sc/run.qs.length*100),b=+(localStorage['b'+run.n]||'0').replace('%','');if(p>=b)localStorage['b'+run.n]=p+'%';
qz.innerHTML=`<div class=s><b style="font-size:44px">${p}%</b><small>${run.sc}/${run.qs.length} to'g'ri</small></div>`+(run.wr.length?'<b>Xatolar:</b>'+run.wr.map(w=>`<div class=i>${w[0]}<br><small>To'g'ri: <b style=color:#16a34a>${w[1]}</b> · Sizniki: <span style=color:#e11d48>${w[2]}</span></small></div>`).join(''):'<p>🎉 Hammasi to\'g\'ri!</p>')+'<button onclick="qz.style.display=\'none\';L()">Yopish</button>';L()}
L()</script>
