<!DOCTYPE html><html lang="uz"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Productivity</title><style>:root{--c:#0f766e}*{margin:0;padding:0;box-sizing:border-box}body{font-family:system-ui,sans-serif;background:#f1f5f9;color:#1e293b;line-height:1.5;min-height:100vh}.container{max-width:900px;margin:0 auto;padding:20px}header{background:var(--c);color:#fff;padding:24px 20px;border-radius:0 0 20px 20px;margin-bottom:24px;text-align:center}header h1{font-size:1.8rem}header p{opacity:.9}.card{background:#fff;border-radius:14px;padding:20px;margin-bottom:16px;box-shadow:0 2px 8px rgba(0,0,0,.06)}h2{color:var(--c);margin-bottom:12px}button{background:var(--c);color:#fff;border:none;padding:10px 18px;border-radius:8px;cursor:pointer;font-size:1rem}button:hover{filter:brightness(1.1)}input,textarea,select{width:100%;padding:10px 12px;border:1px solid #cbd5e1;border-radius:8px;font-size:1rem;margin-bottom:10px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}.item{background:#f8fafc;border-radius:10px;padding:14px;border-left:4px solid var(--c)}footer{text-align:center;color:#94a3b8;font-size:.8rem;padding:20px;margin-top:30px}.success{color:#16a34a}.hidden{display:none}</style></head><body><header><h1>DeepFocus</h1><p>Pomodoro</p></header><div class="container"><div class="card" style="text-align:center"><div id="tm" style="font-size:3.5rem;font-weight:700;color:var(--c)">25:00</div><button onclick="startP()">Boshlash</button> <button onclick="pauseP()" style="background:#64748b">Pauza</button> <button onclick="resetP()" style="background:#dc2626">Reset</button></div><div class="card"><input id="task" placeholder="Vazifa..." onkeypress="if(event.key==='Enter')addT()"><button onclick="addT()" style="width:100%;margin-top:4px">Qo'shish</button><ul id="tl" style="list-style:none;margin-top:12px"></ul></div></div><footer>Ishlaydigan web-sayt</footer><script>let left=25*60,tm,paused=true,tasks=JSON.parse(localStorage.getItem("pom")||"[]");function fmt(s){return String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0")}function tick(){if(paused)return;left--;document.getElementById("tm").textContent=fmt(left);if(left<=0){paused=true;alert("Tugadi!");left=25*60;document.getElementById("tm").textContent=fmt(left)}}function startP(){paused=false;if(!tm)tm=setInterval(tick,1000)}function pauseP(){paused=true}function resetP(){paused=true;left=25*60;document.getElementById("tm").textContent=fmt(left)}function addT(){const v=document.getElementById("task").value.trim();if(!v)return;tasks.push({id:Date.now(),t:v,done:false});localStorage.setItem("pom",JSON.stringify(tasks));document.getElementById("task").value="";rt()}function tog(id){tasks=tasks.map(t=>t.id===id?{...t,done:!t.done}:t);localStorage.setItem("pom",JSON.stringify(tasks));rt()}function del(id){tasks=tasks.filter(t=>t.id!==id);localStorage.setItem("pom",JSON.stringify(tasks));rt()}function rt(){document.getElementById("tl").innerHTML=tasks.map(t=>`<li style="display:flex;gap:8px;padding:8px 0;border-bottom:1px solid #eee"><input type="checkbox" ${t.done?"checked":""} onchange="tog(${t.id})"><span style="flex:1;${t.done?"text-decoration:line-through;color:#94a3b8":""}">${t.t}</span><button onclick="del(${t.id})" style="background:#dc2626;padding:2px 8px">x</button></li>`).join("")}rt()</script></body></html>
