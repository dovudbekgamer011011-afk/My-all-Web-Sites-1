<!DOCTYPE html><html lang="uz"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LearnHub</title><style>:root{--c:#4f46e5}*{margin:0;padding:0;box-sizing:border-box}body{font-family:system-ui,sans-serif;background:#f1f5f9;color:#1e293b;line-height:1.5;min-height:100vh}.container{max-width:900px;margin:0 auto;padding:20px}header{background:var(--c);color:#fff;padding:24px 20px;border-radius:0 0 20px 20px;margin-bottom:24px;text-align:center}header h1{font-size:1.8rem}header p{opacity:.9}.card{background:#fff;border-radius:14px;padding:20px;margin-bottom:16px;box-shadow:0 2px 8px rgba(0,0,0,.06)}h2{color:var(--c);margin-bottom:12px}button{background:var(--c);color:#fff;border:none;padding:10px 18px;border-radius:8px;cursor:pointer;font-size:1rem}button:hover{filter:brightness(1.1)}input,textarea,select{width:100%;padding:10px 12px;border:1px solid #cbd5e1;border-radius:8px;font-size:1rem;margin-bottom:10px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}.item{background:#f8fafc;border-radius:10px;padding:14px;border-left:4px solid var(--c)}footer{text-align:center;color:#94a3b8;font-size:.8rem;padding:20px;margin-top:30px}.success{color:#16a34a}.hidden{display:none}</style></head><body><header><h1>LearnHub</h1><p>Kurslar</p></header><div class="container"><div class="card"><input id="q" placeholder="Qidirish..." oninput="f()"></div><div id="c"></div><div class="card"><h2>Mening</h2><div id="my"></div></div></div><footer>Ishlaydigan web-sayt</footer><script>let en=JSON.parse(localStorage.getItem("en")||"[]");const C=[{id:1,n:"Web Dev",w:12},{id:2,n:"Python DS",w:10},{id:3,n:"Marketing",w:8},{id:4,n:"UI/UX",w:6}];function f(){const q=document.getElementById("q").value.toLowerCase();document.getElementById("c").innerHTML=C.filter(x=>x.n.toLowerCase().includes(q)).map(x=>`<div class="card"><h3>${x.n}</h3><p>${x.w} hafta</p><button onclick="enroll(${x.id})" ${en.includes(x.id)?"disabled style=\"background:#94a3b8\"":""}">${en.includes(x.id)?"Yozilgan":"Yozilish"}</button></div>`).join("");m()}function enroll(id){if(!en.includes(id)){en.push(id);localStorage.setItem("en",JSON.stringify(en));f()}}function m(){document.getElementById("my").innerHTML=en.length?en.map(id=>`<div class="item">${C.find(x=>x.id===id).n}</div>`).join(""):"<p style=\"color:#94a3b8\">Yo'q</p>"}f()</script></body></html>
