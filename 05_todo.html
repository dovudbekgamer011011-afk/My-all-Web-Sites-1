<!DOCTYPE html><html lang="uz"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Todo</title><style>:root{--c:#059669}*{margin:0;padding:0;box-sizing:border-box}body{font-family:system-ui,sans-serif;background:#f1f5f9;color:#1e293b;line-height:1.5;min-height:100vh}.container{max-width:900px;margin:0 auto;padding:20px}header{background:var(--c);color:#fff;padding:24px 20px;border-radius:0 0 20px 20px;margin-bottom:24px;text-align:center}header h1{font-size:1.8rem}header p{opacity:.9}.card{background:#fff;border-radius:14px;padding:20px;margin-bottom:16px;box-shadow:0 2px 8px rgba(0,0,0,.06)}h2{color:var(--c);margin-bottom:12px}button{background:var(--c);color:#fff;border:none;padding:10px 18px;border-radius:8px;cursor:pointer;font-size:1rem}button:hover{filter:brightness(1.1)}input,textarea,select{width:100%;padding:10px 12px;border:1px solid #cbd5e1;border-radius:8px;font-size:1rem;margin-bottom:10px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}.item{background:#f8fafc;border-radius:10px;padding:14px;border-left:4px solid var(--c)}footer{text-align:center;color:#94a3b8;font-size:.8rem;padding:20px;margin-top:30px}.success{color:#16a34a}.hidden{display:none}</style></head><body><header><h1>FocusList</h1><p>To-Do</p></header><div class="container"><div class="card"><input id="task" placeholder="Vazifa..." onkeypress="if(event.key==='Enter')add()"><button onclick="add()" style="width:100%">Qo'shish</button></div><div class="card"><ul id="list" style="list-style:none"></ul><p id="cnt"></p><button onclick="clr()" style="background:#dc2626">Tozalash</button></div></div><footer>Ishlaydigan web-sayt</footer><script>let tasks=JSON.parse(localStorage.getItem("tasks")||"[]");function save(){localStorage.setItem("tasks",JSON.stringify(tasks));r()}function add(){const v=document.getElementById("task").value.trim();if(!v)return;tasks.push({id:Date.now(),text:v,done:false});document.getElementById("task").value="";save()}function tog(id){tasks=tasks.map(t=>t.id===id?{...t,done:!t.done}:t);save()}function del(id){tasks=tasks.filter(t=>t.id!==id);save()}function clr(){tasks=tasks.filter(t=>!t.done);save()}function r(){document.getElementById("list").innerHTML=tasks.map(t=>`<li style="display:flex;gap:8px;padding:8px 0;border-bottom:1px solid #eee"><input type="checkbox" ${t.done?"checked":""} onchange="tog(${t.id})"><span style="flex:1;${t.done?"text-decoration:line-through;color:#94a3b8":""}">${t.text}</span><button onclick="del(${t.id})" style="background:#dc2626;padding:2px 8px">x</button></li>`).join("")||"<p style=\"color:#94a3b8\">Bo'sh</p>";document.getElementById("cnt").textContent=tasks.filter(t=>!t.done).length+" faol"}r()</script></body></html>
