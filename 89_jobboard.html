<!DOCTYPE html><html lang="uz"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Jobs</title><style>:root{--c:#0369a1}*{margin:0;padding:0;box-sizing:border-box}body{font-family:system-ui,sans-serif;background:#f1f5f9;color:#1e293b;line-height:1.5;min-height:100vh}.container{max-width:900px;margin:0 auto;padding:20px}header{background:var(--c);color:#fff;padding:24px 20px;border-radius:0 0 20px 20px;margin-bottom:24px;text-align:center}header h1{font-size:1.8rem}header p{opacity:.9}.card{background:#fff;border-radius:14px;padding:20px;margin-bottom:16px;box-shadow:0 2px 8px rgba(0,0,0,.06)}h2{color:var(--c);margin-bottom:12px}button{background:var(--c);color:#fff;border:none;padding:10px 18px;border-radius:8px;cursor:pointer;font-size:1rem}button:hover{filter:brightness(1.1)}input,textarea,select{width:100%;padding:10px 12px;border:1px solid #cbd5e1;border-radius:8px;font-size:1rem;margin-bottom:10px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}.item{background:#f8fafc;border-radius:10px;padding:14px;border-left:4px solid var(--c)}footer{text-align:center;color:#94a3b8;font-size:.8rem;padding:20px;margin-top:30px}.success{color:#16a34a}.hidden{display:none}</style></head><body><header><h1>JobLink</h1><p>Ish</p></header><div class="container"><div class="card"><input id="q" placeholder="Qidirish..." oninput="f()"><select id="ty" onchange="f()"><option value="all">Barcha</option><option>Remote</option><option>Office</option></select></div><div id="j"></div></div><footer>Ishlaydigan web-sayt</footer><script>const J=[{t:"Frontend Dev",l:"Remote",s:"$70-90k"},{t:"Designer",l:"Toshkent",s:"$50-65k"},{t:"Backend",l:"Remote",s:"$80-100k"},{t:"Analyst",l:"Toshkent",s:"$40-55k"}];function f(){const q=document.getElementById("q").value.toLowerCase();const ty=document.getElementById("ty").value;document.getElementById("j").innerHTML=J.filter(x=>(ty==="all"||x.l===ty||(ty==="Office"&&x.l==="Toshkent"))&&(x.t.toLowerCase().includes(q)||x.l.toLowerCase().includes(q))).map(x=>`<div class="card"><h3>${x.t}</h3><p>${x.l} · ${x.s}</p><button style="margin-top:8px">Ariza</button></div>`).join("")||"<p class=\"card\">Topilmadi</p>"}f()</script></body></html>
