<!DOCTYPE html><html lang="uz"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AutoCare</title><style>:root{--c:#1e3a8a}*{margin:0;padding:0;box-sizing:border-box}body{font-family:system-ui,sans-serif;background:#f1f5f9;color:#1e293b;line-height:1.5;min-height:100vh}.container{max-width:900px;margin:0 auto;padding:20px}header{background:var(--c);color:#fff;padding:24px 20px;border-radius:0 0 20px 20px;margin-bottom:24px;text-align:center}header h1{font-size:1.8rem}header p{opacity:.9}.card{background:#fff;border-radius:14px;padding:20px;margin-bottom:16px;box-shadow:0 2px 8px rgba(0,0,0,.06)}h2{color:var(--c);margin-bottom:12px}button{background:var(--c);color:#fff;border:none;padding:10px 18px;border-radius:8px;cursor:pointer;font-size:1rem}button:hover{filter:brightness(1.1)}input,textarea,select{width:100%;padding:10px 12px;border:1px solid #cbd5e1;border-radius:8px;font-size:1rem;margin-bottom:10px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}.item{background:#f8fafc;border-radius:10px;padding:14px;border-left:4px solid var(--c)}footer{text-align:center;color:#94a3b8;font-size:.8rem;padding:20px;margin-top:30px}.success{color:#16a34a}.hidden{display:none}</style></head><body><header><h1>AutoCare</h1><p>Avtoservis</p></header><div class="container"><div class="card"><div id="sv"></div><p>Jami: <strong id="t">$0</strong></p><button onclick="book()" style="width:100%">Bron</button><p id="m" class="hidden success"></p></div></div><footer>Ishlaydigan web-sayt</footer><script>const S=[{n:"Moy",p:39},{n:"Tormoz",p:89},{n:"Diagnostika",p:59},{n:"Shina",p:25}];let sel={};function r(){document.getElementById("sv").innerHTML=S.map((x,i)=>`<label style="display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #eee"><span><input type="checkbox" onchange="tog(${i},this.checked)"> ${x.n}</span><span>$${x.p}</span></label>`).join("");u()}function tog(i,on){if(on)sel[i]=1;else delete sel[i];u()}function u(){let t=0;Object.keys(sel).forEach(k=>t+=S[k].p);document.getElementById("t").textContent="$"+t}function book(){if(!Object.keys(sel).length){alert("Tanlang");return}document.getElementById("m").textContent="Bron qabul qilindi! "+document.getElementById("t").textContent;document.getElementById("m").classList.remove("hidden")}r()</script></body></html>
