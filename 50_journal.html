<!DOCTYPE html><html lang="uz"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Journal</title><style>:root{--c:#4c1d95}*{margin:0;padding:0;box-sizing:border-box}body{font-family:system-ui,sans-serif;background:#f1f5f9;color:#1e293b;line-height:1.5;min-height:100vh}.container{max-width:900px;margin:0 auto;padding:20px}header{background:var(--c);color:#fff;padding:24px 20px;border-radius:0 0 20px 20px;margin-bottom:24px;text-align:center}header h1{font-size:1.8rem}header p{opacity:.9}.card{background:#fff;border-radius:14px;padding:20px;margin-bottom:16px;box-shadow:0 2px 8px rgba(0,0,0,.06)}h2{color:var(--c);margin-bottom:12px}button{background:var(--c);color:#fff;border:none;padding:10px 18px;border-radius:8px;cursor:pointer;font-size:1rem}button:hover{filter:brightness(1.1)}input,textarea,select{width:100%;padding:10px 12px;border:1px solid #cbd5e1;border-radius:8px;font-size:1rem;margin-bottom:10px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}.item{background:#f8fafc;border-radius:10px;padding:14px;border-left:4px solid var(--c)}footer{text-align:center;color:#94a3b8;font-size:.8rem;padding:20px;margin-top:30px}.success{color:#16a34a}.hidden{display:none}</style></head><body><header><h1>DayNote</h1><p>Kundalik</p></header><div class="container"><div class="card"><textarea id="en" rows="4" placeholder="Bugun nima bo'ldi?"></textarea><button onclick="save()" style="width:100%">Saqlash</button></div><div class="card"><h2>Savollar</h2><ul style="padding-left:20px"><li>Nima tabassum qildirdi?</li><li>Nima o'rgandingiz?</li></ul></div><div class="card"><div id="l"></div></div></div><footer>Ishlaydigan web-sayt</footer><script>let E=JSON.parse(localStorage.getItem("jnl")||"[]");function save(){const v=document.getElementById("en").value.trim();if(!v)return;E.unshift({id:Date.now(),d:new Date().toLocaleString("uz"),t:v});localStorage.setItem("jnl",JSON.stringify(E));document.getElementById("en").value="";r()}function del(id){E=E.filter(x=>x.id!==id);localStorage.setItem("jnl",JSON.stringify(E));r()}function r(){document.getElementById("l").innerHTML=E.map(x=>`<div class="card"><p style="color:#64748b;font-size:.9rem">${x.d}</p><p style="margin:8px 0">${x.t}</p><button onclick="del(${x.id})" style="background:#dc2626;padding:4px 10px">O'chirish</button></div>`).join("")||"<p style=\"color:#94a3b8\">Yo'q</p>"}r()</script></body></html>
