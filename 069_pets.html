<!DOCTYPE html><html lang="uz"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pets</title><style>:root{--c:#ea580c}*{margin:0;padding:0;box-sizing:border-box}body{font-family:system-ui,sans-serif;background:#f1f5f9;color:#1e293b;line-height:1.5;min-height:100vh}.container{max-width:900px;margin:0 auto;padding:20px}header{background:var(--c);color:#fff;padding:24px 20px;border-radius:0 0 20px 20px;margin-bottom:24px;text-align:center}header h1{font-size:1.8rem}header p{opacity:.9}.card{background:#fff;border-radius:14px;padding:20px;margin-bottom:16px;box-shadow:0 2px 8px rgba(0,0,0,.06)}h2{color:var(--c);margin-bottom:12px}button{background:var(--c);color:#fff;border:none;padding:10px 18px;border-radius:8px;cursor:pointer;font-size:1rem}button:hover{filter:brightness(1.1)}input,textarea,select{width:100%;padding:10px 12px;border:1px solid #cbd5e1;border-radius:8px;font-size:1rem;margin-bottom:10px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}.item{background:#f8fafc;border-radius:10px;padding:14px;border-left:4px solid var(--c)}footer{text-align:center;color:#94a3b8;font-size:.8rem;padding:20px;margin-top:30px}.success{color:#16a34a}.hidden{display:none}</style></head><body><header><h1>PawCare</h1><p>Hayvonlar</p></header><div class="container"><div class="card"><input id="pet" placeholder="Hayvon"><input id="task" placeholder="Vazifa"><button onclick="add()" style="width:100%">Qo'shish</button></div><div class="card"><div id="list"></div></div></div><footer>Ishlaydigan web-sayt</footer><script>let L=JSON.parse(localStorage.getItem("pets")||"[]");function add(){const p=document.getElementById("pet").value,t=document.getElementById("task").value;if(!p||!t)return;L.push({id:Date.now(),p,t});localStorage.setItem("pets",JSON.stringify(L));document.getElementById("pet").value="";document.getElementById("task").value="";r()}function del(id){L=L.filter(x=>x.id!==id);localStorage.setItem("pets",JSON.stringify(L));r()}function r(){document.getElementById("list").innerHTML=L.map(x=>`<div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #eee"><span><strong>${x.p}</strong>: ${x.t}</span><button onclick="del(${x.id})" style="background:#dc2626;padding:2px 8px">x</button></div>`).join("")||"<p style=\"color:#94a3b8\">Yo'q</p>"}r()</script></body></html>
