<!DOCTYPE html><html lang="uz"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Parenting</title><style>:root{--c:#db2777}*{margin:0;padding:0;box-sizing:border-box}body{font-family:system-ui,sans-serif;background:#f1f5f9;color:#1e293b;line-height:1.5;min-height:100vh}.container{max-width:900px;margin:0 auto;padding:20px}header{background:var(--c);color:#fff;padding:24px 20px;border-radius:0 0 20px 20px;margin-bottom:24px;text-align:center}header h1{font-size:1.8rem}header p{opacity:.9}.card{background:#fff;border-radius:14px;padding:20px;margin-bottom:16px;box-shadow:0 2px 8px rgba(0,0,0,.06)}h2{color:var(--c);margin-bottom:12px}button{background:var(--c);color:#fff;border:none;padding:10px 18px;border-radius:8px;cursor:pointer;font-size:1rem}button:hover{filter:brightness(1.1)}input,textarea,select{width:100%;padding:10px 12px;border:1px solid #cbd5e1;border-radius:8px;font-size:1rem;margin-bottom:10px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}.item{background:#f8fafc;border-radius:10px;padding:14px;border-left:4px solid var(--c)}footer{text-align:center;color:#94a3b8;font-size:.8rem;padding:20px;margin-top:30px}.success{color:#16a34a}.hidden{display:none}</style></head><body><header><h1>ParentGuide</h1><p>Ota-onalar</p></header><div class="container"><div class="card"><input id="q" placeholder="Qidirish..." oninput="f()"></div><div id="a"></div><div class="card"><h2>Eslatma</h2><input id="note" placeholder="Eslatma..."><button onclick="addN()" style="width:100%">Saqlash</button><div id="notes" style="margin-top:12px"></div></div></div><footer>Ishlaydigan web-sayt</footer><script>const A=[{t:"Uyqu o'rgatish",x:"Yumshoq usullar"},{t:"Ekran vaqti",x:"Sog'lom odatlar"},{t:"Ijobiy tarbiya",x:"Mehribon bola"}];let N=JSON.parse(localStorage.getItem("pn")||"[]");function f(){const q=document.getElementById("q").value.toLowerCase();document.getElementById("a").innerHTML=A.filter(x=>x.t.toLowerCase().includes(q)).map(x=>`<div class="card"><h3>${x.t}</h3><p>${x.x}</p></div>`).join("")}function addN(){const v=document.getElementById("note").value.trim();if(!v)return;N.unshift({id:Date.now(),t:v});localStorage.setItem("pn",JSON.stringify(N));document.getElementById("note").value="";rn()}function delN(id){N=N.filter(x=>x.id!==id);localStorage.setItem("pn",JSON.stringify(N));rn()}function rn(){document.getElementById("notes").innerHTML=N.map(x=>`<div style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid #eee"><span>${x.t}</span><button onclick="delN(${x.id})" style="background:#dc2626;padding:2px 8px">x</button></div>`).join("")}f();rn()</script></body></html>
