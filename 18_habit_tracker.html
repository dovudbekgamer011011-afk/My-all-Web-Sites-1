<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Odat Kuzatuvchi</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',system-ui,sans-serif;min-height:100vh;background:#0f0f13;color:#e8e8ed;line-height:1.5}
.wrap{max-width:720px;margin:0 auto;padding:32px 20px}
.hero{text-align:center;margin-bottom:32px}
.hero h1{font-size:1.85rem;font-weight:700;background:linear-gradient(135deg,#a78bfa,#38bdf8);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:6px}
.hero p{color:#94a3b8;font-size:.95rem}
.card{background:rgba(30,30,40,.85);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.08);border-radius:20px;padding:24px;margin-bottom:20px;box-shadow:0 8px 32px rgba(0,0,0,.3)}
.card h2{font-size:1.1rem;font-weight:600;margin-bottom:16px;color:#f1f5f9}
label{display:block;font-size:.85rem;color:#94a3b8;margin-bottom:6px}
input,select,textarea{width:100%;padding:12px 14px;border-radius:12px;border:1px solid rgba(255,255,255,.1);background:rgba(15,15,20,.6);color:#f1f5f9;font-size:1rem;margin-bottom:14px;outline:none;transition:border .2s}
input:focus,select:focus,textarea:focus{border-color:#a78bfa}
button{background:linear-gradient(135deg,#7c3aed,#2563eb);color:#fff;border:none;padding:12px 20px;border-radius:12px;font-size:1rem;font-weight:600;cursor:pointer;transition:transform .15s,box-shadow .15s}
button:hover{transform:translateY(-1px);box-shadow:0 6px 20px rgba(124,58,237,.4)}
button.secondary{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12)}
button.danger{background:linear-gradient(135deg,#dc2626,#b91c1c)}
.row{display:flex;gap:12px;flex-wrap:wrap}
.row>*{flex:1;min-width:120px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px}
.pill{display:inline-block;padding:4px 12px;border-radius:999px;font-size:.8rem;background:rgba(167,139,250,.15);color:#c4b5fd}
.muted{color:#94a3b8;font-size:.9rem}
.success{color:#4ade80}
.result{font-size:2rem;font-weight:700;text-align:center;padding:16px;word-break:break-all}
footer{text-align:center;color:#64748b;font-size:.8rem;margin-top:40px}

</style>
</head>
<body>
<div class="wrap">

<div class="hero"><h1>📅 Odat Kuzatuvchi</h1><p>Kundalik odatlaringizni belgilang</p></div>
<div class="card">
  <div class="row">
    <input id="habit" placeholder="Yangi odat (masalan: 30 daqiqa o'qish)" style="margin:0;flex:2">
    <button onclick="addHabit()" style="flex:0 0 auto">Qo'shish</button>
  </div>
</div>
<div id="list"></div>

<footer>Ishlaydigan web-sayt · HTML + CSS + JS</footer>
</div>
<script>
let habits=JSON.parse(localStorage.getItem('habits')||'[]');
const today=new Date().toISOString().slice(0,10);
function save(){localStorage.setItem('habits',JSON.stringify(habits));render()}
function addHabit(){
  const n=document.getElementById('habit').value.trim();
  if(!n)return;
  habits.push({id:Date.now(),name:n,done:[]});
  document.getElementById('habit').value='';
  save();
}
function toggle(id){
  habits=habits.map(h=>{
    if(h.id!==id)return h;
    const done=h.done.includes(today)?h.done.filter(d=>d!==today):[...h.done,today];
    return {...h,done};
  });
  save();
}
function del(id){habits=habits.filter(h=>h.id!==id);save()}
function streak(h){
  let s=0;const d=new Date();
  for(;;){const ds=d.toISOString().slice(0,10);if(h.done.includes(ds)){s++;d.setDate(d.getDate()-1)}else break}
  return s;
}
function render(){
  document.getElementById('list').innerHTML=habits.length?habits.map(h=>{
    const isDone=h.done.includes(today);
    return `<div class="card" style="display:flex;align-items:center;gap:14px">
      <button onclick="toggle(${h.id})" style="width:44px;height:44px;border-radius:50%;padding:0;font-size:1.2rem;background:${isDone?'linear-gradient(135deg,#22c55e,#16a34a)':'rgba(255,255,255,.08)'}">${isDone?'✓':''}</button>
      <div style="flex:1"><div style="font-weight:600">${h.name}</div><div class="muted">Seriya: ${streak(h)} kun · Jami: ${h.done.length}</div></div>
      <button class="danger" onclick="del(${h.id})" style="padding:8px 12px">×</button>
    </div>`;
  }).join(''):'<div class="card muted" style="text-align:center">Hali odat yo\'q. Qo\'shing!</div>';
}
render();
document.getElementById('habit').onkeypress=e=>{if(e.key==='Enter')addHabit()};
</script>
</body>
</html>
