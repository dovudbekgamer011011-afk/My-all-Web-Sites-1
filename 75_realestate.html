<!DOCTYPE html><html lang="uz"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RealEstate</title><style>:root{--c:#0f766e}*{margin:0;padding:0;box-sizing:border-box}body{font-family:system-ui,sans-serif;background:#f1f5f9;color:#1e293b;line-height:1.5;min-height:100vh}.container{max-width:900px;margin:0 auto;padding:20px}header{background:var(--c);color:#fff;padding:24px 20px;border-radius:0 0 20px 20px;margin-bottom:24px;text-align:center}header h1{font-size:1.8rem}header p{opacity:.9}.card{background:#fff;border-radius:14px;padding:20px;margin-bottom:16px;box-shadow:0 2px 8px rgba(0,0,0,.06)}h2{color:var(--c);margin-bottom:12px}button{background:var(--c);color:#fff;border:none;padding:10px 18px;border-radius:8px;cursor:pointer;font-size:1rem}button:hover{filter:brightness(1.1)}input,textarea,select{width:100%;padding:10px 12px;border:1px solid #cbd5e1;border-radius:8px;font-size:1rem;margin-bottom:10px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}.item{background:#f8fafc;border-radius:10px;padding:14px;border-left:4px solid var(--c)}footer{text-align:center;color:#94a3b8;font-size:.8rem;padding:20px;margin-top:30px}.success{color:#16a34a}.hidden{display:none}</style></head><body><header><h1>HomeFind</h1><p>Uy</p></header><div class="container"><div class="card"><select id="type" onchange="f()"><option value="all">Hammasi</option><option value="rent">Ijara</option><option value="sale">Sotuv</option></select><input id="max" type="number" placeholder="Max narx" oninput="f()"></div><div id="l"></div></div><footer>Ishlaydigan web-sayt</footer><script>const H=[{t:"Kvartira",ty:"rent",p:1850,b:2},{t:"Oilaviy uy",ty:"sale",p:425000,b:4},{t:"Studio",ty:"rent",p:1200,b:1},{t:"3 xona",ty:"sale",p:98000,b:3}];function f(){const ty=document.getElementById("type").value;const m=+document.getElementById("max").value||Infinity;document.getElementById("l").innerHTML=H.filter(h=>(ty==="all"||h.ty===ty)&&h.p<=m).map(h=>`<div class="card"><h3>${h.t}</h3><p style="font-size:1.3rem;color:var(--c)">${h.ty==="rent"?"$"+h.p+"/oy":"$"+h.p.toLocaleString()}</p><p>${h.b} xona</p></div>`).join("")||"<p class=\"card\">Topilmadi</p>"}f()</script></body></html>
