<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hisob-faktura</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',system-ui,sans-serif;min-height:100vh;background:#0f0f13;color:#e8e8ed;line-height:1.5}
.wrap{max-width:720px;margin:0 auto;padding:32px 20px}
.hero{text-align:center;margin-bottom:32px}
.hero h1{font-size:1.85rem;font-weight:700;background:linear-gradient(135deg,#a78bfa,#38bdf8);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:6px}
.hero p{color:#94a3b8;font-size:.95rem}
.card{background:rgba(30,30,40,.85);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.08);border-radius:20px;padding:24px;margin-bottom:20px;box-shadow:0 8px 32px rgba(0,0,0,.3)}
.card h2{font-size:1.1rem;font-weight:600;margin-bottom:16px;color:#f1f5f9}
label{display:block;font-size:.85rem;color:#94a3b8;margin-bottom:6px}
input,select,textarea{width:100%;padding:12px 14px;border-radius:12px;border:1px solid rgba(255,255,255,.1);background:rgba(15,15,20,.6);color:#f1f5f9;font-size:1rem;margin-bottom:14px;outline:none;transition:border .2s}
input:focus,select:focus,textarea:focus{border-color:#a78bfa}
button{background:linear-gradient(135deg,#7c3aed,#2563eb);color:#fff;border:none;padding:12px 20px;border-radius:12px;font-size:1rem;font-weight:600;cursor:pointer;transition:transform .15s,box-shadow .15s}
button:hover{transform:translateY(-1px);box-shadow:0 6px 20px rgba(124,58,237,.4)}
button.secondary{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12)}
button.danger{background:linear-gradient(135deg,#dc2626,#b91c1c)}
.row{display:flex;gap:12px;flex-wrap:wrap}
.row>*{flex:1;min-width:120px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px}
.pill{display:inline-block;padding:4px 12px;border-radius:999px;font-size:.8rem;background:rgba(167,139,250,.15);color:#c4b5fd}
.muted{color:#94a3b8;font-size:.9rem}
.success{color:#4ade80}
.result{font-size:2rem;font-weight:700;text-align:center;padding:16px;word-break:break-all}
footer{text-align:center;color:#64748b;font-size:.8rem;margin-top:40px}

</style>
</head>
<body>
<div class="wrap">

<div class="hero"><h1>📄 Hisob-faktura</h1><p>Tez hisob-faktura yarating</p></div>
<div class="card">
  <div class="row">
    <div><label>Mijoz</label><input id="client" placeholder="Ism / kompaniya"></div>
    <div><label>Sana</label><input type="date" id="date"></div>
  </div>
  <label>Xizmat / mahsulot</label>
  <input id="item" placeholder="Masalan: Web dizayn">
  <div class="row">
    <div><label>Narx</label><input type="number" id="price" placeholder="0" step="0.01"></div>
    <div><label>Miqdor</label><input type="number" id="qty" value="1" min="1"></div>
  </div>
  <button onclick="addItem()" style="width:100%">Qo'shish</button>
</div>
<div class="card">
  <h2>Pozitsiyalar</h2>
  <div id="items"></div>
  <div style="display:flex;justify-content:space-between;margin-top:16px;padding-top:16px;border-top:1px solid rgba(255,255,255,.1)">
    <strong>Jami</strong>
    <strong id="total" style="color:#a78bfa;font-size:1.3rem">$0.00</strong>
  </div>
  <button onclick="printInv()" style="width:100%;margin-top:16px">Chop etish / PDF</button>
</div>

<footer>Ishlaydigan web-sayt · HTML + CSS + JS</footer>
</div>
<script>
let items=[];
document.getElementById('date').value=new Date().toISOString().slice(0,10);
function addItem(){
  const name=document.getElementById('item').value.trim();
  const price=+document.getElementById('price').value||0;
  const qty=+document.getElementById('qty').value||1;
  if(!name||!price)return;
  items.push({name,price,qty});
  document.getElementById('item').value='';
  document.getElementById('price').value='';
  document.getElementById('qty').value='1';
  render();
}
function del(i){items.splice(i,1);render()}
function render(){
  document.getElementById('items').innerHTML=items.map((x,i)=>`
    <div style="display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid rgba(255,255,255,.06)">
      <span>${x.name} ×${x.qty}</span>
      <span>$${(x.price*x.qty).toFixed(2)} <button class="danger" style="padding:2px 8px;margin-left:8px" onclick="del(${i})">×</button></span>
    </div>`).join('')||'<p class="muted">Pozitsiya yo\'q</p>';
  const t=items.reduce((s,x)=>s+x.price*x.qty,0);
  document.getElementById('total').textContent='$'+t.toFixed(2);
}
function printInv(){
  const client=document.getElementById('client').value||'Mijoz';
  const date=document.getElementById('date').value;
  const rows=items.map(x=>`<tr><td>${x.name}</td><td>${x.qty}</td><td>$${x.price.toFixed(2)}</td><td>$${(x.price*x.qty).toFixed(2)}</td></tr>`).join('');
  const t=items.reduce((s,x)=>s+x.price*x.qty,0);
  const w=window.open('','','width=700,height=600');
  w.document.write(`<html><head><title>Hisob-faktura</title><style>body{font-family:system-ui;padding:40px}table{width:100%;border-collapse:collapse;margin-top:20px}th,td{border:1px solid #ddd;padding:10px;text-align:left}th{background:#f1f5f9}.total{font-size:1.3rem;margin-top:20px;text-align:right}</style></head><body>
  <h1>Hisob-faktura</h1><p><strong>Mijoz:</strong> ${client}<br><strong>Sana:</strong> ${date}</p>
  <table><tr><th>Nomi</th><th>Miqdor</th><th>Narx</th><th>Summa</th></tr>${rows}</table>
  <p class="total"><strong>Jami: $${t.toFixed(2)}</strong></p>
  <script>window.print()<\/script></body></html>`);
  w.document.close();
}
render();
</script>
</body>
</html>
