<!DOCTYPE html><html lang="uz"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Meditation</title><style>:root{--c:#5b21b6}*{margin:0;padding:0;box-sizing:border-box}body{font-family:system-ui,sans-serif;background:#f1f5f9;color:#1e293b;line-height:1.5;min-height:100vh}.container{max-width:900px;margin:0 auto;padding:20px}header{background:var(--c);color:#fff;padding:24px 20px;border-radius:0 0 20px 20px;margin-bottom:24px;text-align:center}header h1{font-size:1.8rem}header p{opacity:.9}.card{background:#fff;border-radius:14px;padding:20px;margin-bottom:16px;box-shadow:0 2px 8px rgba(0,0,0,.06)}h2{color:var(--c);margin-bottom:12px}button{background:var(--c);color:#fff;border:none;padding:10px 18px;border-radius:8px;cursor:pointer;font-size:1rem}button:hover{filter:brightness(1.1)}input,textarea,select{width:100%;padding:10px 12px;border:1px solid #cbd5e1;border-radius:8px;font-size:1rem;margin-bottom:10px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}.item{background:#f8fafc;border-radius:10px;padding:14px;border-left:4px solid var(--c)}footer{text-align:center;color:#94a3b8;font-size:.8rem;padding:20px;margin-top:30px}.success{color:#16a34a}.hidden{display:none}</style></head><body><header><h1>CalmMind</h1><p>Meditatsiya</p></header><div class="container"><div class="card"><button onclick="start(10)" style="width:100%;margin-bottom:8px">10 daqiqa</button><button onclick="start(15)" style="width:100%;margin-bottom:8px">15 daqiqa</button><button onclick="start(20)" style="width:100%">20 daqiqa</button></div><div class="card" style="text-align:center"><div id="tm" style="font-size:3rem;font-weight:700;color:var(--c)">00:00</div><p id="st">Tanlang</p><button onclick="stop()" id="sb" class="hidden" style="background:#dc2626">To'xtatish</button></div></div><footer>Ishlaydigan web-sayt</footer><script>let tm,left=0;function start(min){clearInterval(tm);left=min*60;document.getElementById("sb").classList.remove("hidden");document.getElementById("st").textContent="Meditatsiya...";tick();tm=setInterval(tick,1000)}function tick(){if(left<=0){clearInterval(tm);document.getElementById("st").textContent="Tugadi!";document.getElementById("sb").classList.add("hidden");return}document.getElementById("tm").textContent=String(Math.floor(left/60)).padStart(2,"0")+":"+String(left%60).padStart(2,"0");left--}function stop(){clearInterval(tm);document.getElementById("tm").textContent="00:00";document.getElementById("st").textContent="To'xtatildi";document.getElementById("sb").classList.add("hidden")}</script></body></html>
