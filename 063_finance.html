<!DOCTYPE html><html lang="uz"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Finance</title><style>:root{--c:#ca8a04}*{margin:0;padding:0;box-sizing:border-box}body{font-family:system-ui,sans-serif;background:#f1f5f9;color:#1e293b;line-height:1.5;min-height:100vh}.container{max-width:900px;margin:0 auto;padding:20px}header{background:var(--c);color:#fff;padding:24px 20px;border-radius:0 0 20px 20px;margin-bottom:24px;text-align:center}header h1{font-size:1.8rem}header p{opacity:.9}.card{background:#fff;border-radius:14px;padding:20px;margin-bottom:16px;box-shadow:0 2px 8px rgba(0,0,0,.06)}h2{color:var(--c);margin-bottom:12px}button{background:var(--c);color:#fff;border:none;padding:10px 18px;border-radius:8px;cursor:pointer;font-size:1rem}button:hover{filter:brightness(1.1)}input,textarea,select{width:100%;padding:10px 12px;border:1px solid #cbd5e1;border-radius:8px;font-size:1rem;margin-bottom:10px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}.item{background:#f8fafc;border-radius:10px;padding:14px;border-left:4px solid var(--c)}footer{text-align:center;color:#94a3b8;font-size:.8rem;padding:20px;margin-top:30px}.success{color:#16a34a}.hidden{display:none}</style></head><body><header><h1>MoneyWise</h1><p>Moliya</p></header><div class="container"><div class="card"><select id="type"><option value="income">Kirim</option><option value="expense">Chiqim</option></select><input id="amt" type="number" placeholder="Summa"><input id="desc" placeholder="Izoh"><button onclick="add()" style="width:100%">Qo'shish</button></div><div class="card"><div class="grid"><div class="item"><strong id="inc" style="color:#16a34a">$0</strong><br>Kirim</div><div class="item"><strong id="exp" style="color:#dc2626">$0</strong><br>Chiqim</div><div class="item"><strong id="bal">$0</strong><br>Balans</div></div></div><div class="card"><div id="list"></div></div></div><footer>Ishlaydigan web-sayt</footer><script>let tx=JSON.parse(localStorage.getItem("fin")||"[]");function add(){const a=+document.getElementById("amt").value;if(!a)return;tx.unshift({id:Date.now(),type:document.getElementById("type").value,a,d:document.getElementById("desc").value||"—",dt:new Date().toLocaleDateString("uz")});localStorage.setItem("fin",JSON.stringify(tx));document.getElementById("amt").value="";document.getElementById("desc").value="";r()}function del(id){tx=tx.filter(t=>t.id!==id);localStorage.setItem("fin",JSON.stringify(tx));r()}function r(){let i=0,e=0;tx.forEach(t=>t.type==="income"?i+=t.a:e+=t.a);document.getElementById("inc").textContent="$"+i.toFixed(2);document.getElementById("exp").textContent="$"+e.toFixed(2);document.getElementById("bal").textContent="$"+(i-e).toFixed(2);document.getElementById("list").innerHTML=tx.map(t=>`<div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #eee"><span>${t.dt} ${t.d}</span><span style="color:${t.type==="income"?"#16a34a":"#dc2626"}">${t.type==="income"?"+":"-"}$${t.a} <button onclick="del(${t.id})" style="padding:2px 8px;background:#dc2626">x</button></span></div>`).join("")||"<p style=\"color:#94a3b8\">Yo'q</p>"}r()</script></body></html>
