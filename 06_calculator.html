<!DOCTYPE html><html lang="uz"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Calculator</title><style>:root{--c:#4b5563}*{margin:0;padding:0;box-sizing:border-box}body{font-family:system-ui,sans-serif;background:#f1f5f9;color:#1e293b;line-height:1.5;min-height:100vh}.container{max-width:900px;margin:0 auto;padding:20px}header{background:var(--c);color:#fff;padding:24px 20px;border-radius:0 0 20px 20px;margin-bottom:24px;text-align:center}header h1{font-size:1.8rem}header p{opacity:.9}.card{background:#fff;border-radius:14px;padding:20px;margin-bottom:16px;box-shadow:0 2px 8px rgba(0,0,0,.06)}h2{color:var(--c);margin-bottom:12px}button{background:var(--c);color:#fff;border:none;padding:10px 18px;border-radius:8px;cursor:pointer;font-size:1rem}button:hover{filter:brightness(1.1)}input,textarea,select{width:100%;padding:10px 12px;border:1px solid #cbd5e1;border-radius:8px;font-size:1rem;margin-bottom:10px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}.item{background:#f8fafc;border-radius:10px;padding:14px;border-left:4px solid var(--c)}footer{text-align:center;color:#94a3b8;font-size:.8rem;padding:20px;margin-top:30px}.success{color:#16a34a}.hidden{display:none}</style></head><body><header><h1>QuickCalc</h1></header><div class="container" style="max-width:320px"><div class="card"><div id="d" style="background:#111;color:#fff;font-size:2rem;text-align:right;padding:16px;border-radius:8px;margin-bottom:10px">0</div><div style="display:grid;grid-template-columns:repeat(4,1fr);gap:8px" id="k"></div></div></div><footer>Ishlaydigan web-sayt</footer><script>let e="";const ks=["C","±","%","÷","7","8","9","×","4","5","6","-","1","2","3","+","0",".","="];const b=document.getElementById("k");ks.forEach(k=>{const btn=document.createElement("button");btn.textContent=k;btn.style.padding="16px";if(k==="0")btn.style.gridColumn="span 2";if(["÷","×","-","+","="].includes(k))btn.style.background="#f59e0b";if(k==="C")btn.style.background="#dc2626";btn.onclick=()=>p(k);b.appendChild(btn)});function p(k){if(k==="C")e="";else if(k==="="){try{e=String(eval(e.replace(/×/g,"*").replace(/÷/g,"/")))}catch{e="Err"}}else if(k==="±")e=e?String(-parseFloat(e)):"";else if(k==="%")e=e?String(parseFloat(e)/100):"";else e+=k;document.getElementById("d").textContent=e||"0"}</script></body></html>
