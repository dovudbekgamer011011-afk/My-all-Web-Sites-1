<!DOCTYPE html><html lang="uz"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Language</title><style>:root{--c:#7e22ce}*{margin:0;padding:0;box-sizing:border-box}body{font-family:system-ui,sans-serif;background:#f1f5f9;color:#1e293b;line-height:1.5;min-height:100vh}.container{max-width:900px;margin:0 auto;padding:20px}header{background:var(--c);color:#fff;padding:24px 20px;border-radius:0 0 20px 20px;margin-bottom:24px;text-align:center}header h1{font-size:1.8rem}header p{opacity:.9}.card{background:#fff;border-radius:14px;padding:20px;margin-bottom:16px;box-shadow:0 2px 8px rgba(0,0,0,.06)}h2{color:var(--c);margin-bottom:12px}button{background:var(--c);color:#fff;border:none;padding:10px 18px;border-radius:8px;cursor:pointer;font-size:1rem}button:hover{filter:brightness(1.1)}input,textarea,select{width:100%;padding:10px 12px;border:1px solid #cbd5e1;border-radius:8px;font-size:1rem;margin-bottom:10px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}.item{background:#f8fafc;border-radius:10px;padding:14px;border-left:4px solid var(--c)}footer{text-align:center;color:#94a3b8;font-size:.8rem;padding:20px;margin-top:30px}.success{color:#16a34a}.hidden{display:none}</style></head><body><header><h1>SpeakEasy</h1><p>Til</p></header><div class="container"><div class="card"><h2>Ispancha</h2><div id="cards"></div><button onclick="next()" style="width:100%;margin-top:12px">Keyingi</button><p id="sc" style="text-align:center;margin-top:8px"></p></div></div><footer>Ishlaydigan web-sayt</footer><script>const C=[{q:"Salom",a:"Hola"},{q:"Qalaysiz?",a:"¿Cómo estás?"},{q:"Rahmat",a:"Gracias"},{q:"Xayr",a:"Adiós"}];let i=0;function show(){document.getElementById("cards").innerHTML=`<div style="text-align:center;padding:20px"><p style="font-size:1.5rem">${C[i].q}</p><p id="ans" class="hidden" style="font-size:1.8rem;color:var(--c);margin-top:12px">${C[i].a}</p><button onclick="document.getElementById('ans').classList.remove('hidden')" style="margin-top:12px;background:#64748b">Javob</button></div>`}function next(){i=(i+1)%C.length;document.getElementById("sc").textContent=(i||C.length)+"/"+C.length;show()}show()</script></body></html>
