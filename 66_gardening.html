<!DOCTYPE html><html lang="uz"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Garden</title><style>:root{--c:#65a30d}*{margin:0;padding:0;box-sizing:border-box}body{font-family:system-ui,sans-serif;background:#f1f5f9;color:#1e293b;line-height:1.5;min-height:100vh}.container{max-width:900px;margin:0 auto;padding:20px}header{background:var(--c);color:#fff;padding:24px 20px;border-radius:0 0 20px 20px;margin-bottom:24px;text-align:center}header h1{font-size:1.8rem}header p{opacity:.9}.card{background:#fff;border-radius:14px;padding:20px;margin-bottom:16px;box-shadow:0 2px 8px rgba(0,0,0,.06)}h2{color:var(--c);margin-bottom:12px}button{background:var(--c);color:#fff;border:none;padding:10px 18px;border-radius:8px;cursor:pointer;font-size:1rem}button:hover{filter:brightness(1.1)}input,textarea,select{width:100%;padding:10px 12px;border:1px solid #cbd5e1;border-radius:8px;font-size:1rem;margin-bottom:10px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}.item{background:#f8fafc;border-radius:10px;padding:14px;border-left:4px solid var(--c)}footer{text-align:center;color:#94a3b8;font-size:.8rem;padding:20px;margin-top:30px}.success{color:#16a34a}.hidden{display:none}</style></head><body><header><h1>GreenThumb</h1><p>Bog'</p></header><div class="container"><div class="card"><input id="pl" placeholder="O'simlik"><select id="fq"><option value="1">Har kuni</option><option value="3">3 kunda</option><option value="7">Haftada</option></select><button onclick="add()" style="width:100%">Qo'shish</button></div><div id="ps"></div></div><footer>Ishlaydigan web-sayt</footer><script>let pl=JSON.parse(localStorage.getItem("pl")||"[]");function add(){const n=document.getElementById("pl").value;if(!n)return;pl.push({id:Date.now(),n,f:+document.getElementById("fq").value,last:Date.now()});localStorage.setItem("pl",JSON.stringify(pl));document.getElementById("pl").value="";r()}function water(id){pl=pl.map(p=>p.id===id?{...p,last:Date.now()}:p);localStorage.setItem("pl",JSON.stringify(pl));r()}function del(id){pl=pl.filter(p=>p.id!==id);localStorage.setItem("pl",JSON.stringify(pl));r()}function r(){document.getElementById("ps").innerHTML=pl.map(p=>{const d=Math.floor((Date.now()-p.last)/86400000);return `<div class="card"><strong>${p.n}</strong> · har ${p.f} kun<br>Oxirgi: ${d} kun ${d>=p.f?'<span style="color:#dc2626">· Sug\'or!</span>':""}<br><button onclick="water(${p.id})">Sug'ordim</button> <button onclick="del(${p.id})" style="background:#dc2626">x</button></div>`}).join("")||"<p class=\"card\" style=\"color:#94a3b8\">Qo'shing</p>"}r()</script></body></html>
