<!doctype html><html lang=uz><meta charset=utf-8><meta name=viewport content='width=device-width,initial-scale=1'><title>Kundalik va kayfiyat</title><style>:root{--a:#ec4899;--b:#f97316}:root{--bg:#f4f5fb;--c:#fff;--t:#1c2033;--m:#6c7293;--l:#e4e7f3}@media(prefers-color-scheme:dark){:root{--bg:#0f1224;--c:#181c36;--t:#eceeff;--m:#9aa0c8;--l:#2a2f55}}*{box-sizing:border-box}body{margin:0;font:15px/1.5 system-ui,sans-serif;background:var(--bg);color:var(--t)}header{background:linear-gradient(135deg,var(--a),var(--b));color:#fff;padding:26px 18px 40px}header h1{margin:0;font-size:26px}header p{margin:4px 0 0;opacity:.85}main{max-width:760px;margin:-22px auto 30px;padding:0 14px;display:grid;gap:14px}.k{background:var(--c);border:1px solid var(--l);border-radius:18px;padding:16px;box-shadow:0 8px 24px rgba(30,40,100,.08)}input,select,textarea{font:inherit;color:var(--t);background:var(--bg);border:1px solid var(--l);border-radius:12px;padding:10px 12px;width:100%;outline:0}input:focus,select:focus,textarea:focus{border-color:var(--a)}button{font:inherit;border:0;border-radius:12px;padding:9px 13px;background:var(--a);color:#fff;font-weight:600;cursor:pointer}button.g{background:var(--bg);color:var(--t);border:1px solid var(--l)}.r{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}.s{text-align:center}.s b{display:block;font-size:26px;color:var(--a)}.s small{color:var(--m)}table{width:100%;border-collapse:collapse}td,th{padding:8px;border-bottom:1px solid var(--l);text-align:left}.i{border:1px solid var(--l);border-radius:14px;padding:12px;margin:8px 0}</style><header><h1>Kundalik va kayfiyat</h1><p>Har kun yozing, kayfiyatingizni kuzating</p></header><main>
<div class=k><div style="display:flex;gap:8px;align-items:center;margin-bottom:10px"><input type=date id=dt onchange=load() style="width:auto"><div id=mo style="display:flex;gap:6px;margin-left:auto"></div></div><textarea id=tx rows=6 placeholder="Bugun nima bo'ldi? Nimadan minnatdorsiz?"></textarea><div style="display:flex;gap:8px;margin-top:8px"><button onclick=save()>Saqlash</button><button class=g onclick=del()>O'chirish</button></div></div>
<div class="k r" id=st></div>
<div class=k><b>Oxirgi 35 kun</b><div id=hm style="display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:8px"></div></div>
<div class=k><input id=q placeholder="Yozuvlardan qidirish…" oninput=R() style="margin-bottom:8px"><div id=ls></div><button class=g onclick=ex()>TXT yuklab olish</button></div>
<script>const EM=['😞','😕','😐','🙂','😄'],CL=['#ef4444','#f97316','#eab308','#84cc16','#22c55e'],iso=x=>{x=new Date(x);return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0')};
let E=JSON.parse(localStorage.kun||'{}'),mood=2;dt.value=iso(Date.now());
mo.innerHTML=EM.map((e,i)=>`<button class=g id=m${i} onclick="mood=${i};M()" style="font-size:20px;padding:4px 8px">${e}</button>`).join('');
function M(){EM.forEach((_,i)=>document.getElementById('m'+i).style.outline=i==mood?'2px solid var(--a)':'none')}
function load(){let e=E[dt.value];tx.value=e?e.t:'';mood=e?e.m:2;M()}
function sv(){localStorage.kun=JSON.stringify(E);R()}
function save(){if(!tx.value.trim())return;E[dt.value]={m:mood,t:tx.value.trim()};sv()}
function del(){delete E[dt.value];tx.value='';sv()}
function ex(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([Object.keys(E).sort().map(k=>k+' '+EM[E[k].m]+'\n'+E[k].t).join('\n\n')]));a.download='kundalik.txt';a.click()}
function R(){let ks=Object.keys(E),av=ks.length?(ks.reduce((s,k)=>s+E[k].m+1,0)/ks.length).toFixed(1):'—',sk=0,x=new Date();while(E[iso(x)]){sk++;x.setDate(x.getDate()-1)}
st.innerHTML=`<div class=s><b>${ks.length}</b><small>yozuv</small></div><div class=s><b>${sk}</b><small>kun ketma-ket</small></div><div class=s><b>${av}</b><small>o'rtacha kayfiyat /5</small></div>`;
hm.innerHTML=[...Array(35)].map((_,i)=>{let x=new Date();x.setDate(x.getDate()-34+i);let k=iso(x),e=E[k];return `<div onclick="dt.value='${k}';load()" title="${k}" style="cursor:pointer;aspect-ratio:1;border-radius:8px;background:${e?CL[e.m]:'var(--bg)'};border:1px solid var(--l);display:grid;place-items:center;font-size:11px;color:${e?'#fff':'var(--m)'}">${x.getDate()}</div>`}).join('');
let f=q.value.toLowerCase();ls.innerHTML=ks.sort().reverse().filter(k=>E[k].t.toLowerCase().includes(f)).slice(0,15).map(k=>`<div class=i onclick="dt.value='${k}';load();scrollTo(0,0)" style="cursor:pointer"><b>${EM[E[k].m]} ${k}</b><div style="color:var(--m);white-space:pre-wrap">${E[k].t.replace(/</g,'&lt;').slice(0,160)}</div></div>`).join('')||'<p>Yozuvlar yo\'q</p>'}
load();R()</script>
