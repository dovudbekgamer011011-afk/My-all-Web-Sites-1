<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SuhbatUZ - Til o‘rganish</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body class="bg-violet-50 text-gray-800">
    <header class="bg-white shadow-sm sticky top-0 z-50">
        <div class="max-w-6xl mx-auto px-4 py-4 flex justify-between items-center">
            <div class="flex items-center gap-2 cursor-pointer" onclick="showPage('home')">
                <i class="fas fa-language text-violet-600 text-2xl"></i>
                <span class="text-xl font-bold text-violet-600">SuhbatUZ</span>
            </div>
            <button onclick="showPage('partners')" class="bg-violet-600 text-white px-4 py-2 rounded-lg text-sm font-medium hover:bg-violet-700">
                Hamroh topish
            </button>
        </div>
    </header>

    <div id="page-home">
        <section class="bg-gradient-to-r from-violet-600 to-purple-800 text-white py-16">
            <div class="max-w-6xl mx-auto px-4 text-center">
                <h1 class="text-4xl md:text-5xl font-bold mb-4">Til o‘rganing — haqiqiy odamlar bilan</h1>
                <p class="text-xl text-violet-100 mb-8">Ingliz, koreys, nemis va boshqa tillar</p>
                <button onclick="showPage('partners')" class="bg-white text-violet-700 px-8 py-3 rounded-lg font-semibold text-lg">Suhbatdosh topish</button>
            </div>
        </section>
        <section class="py-12">
            <div class="max-w-6xl mx-auto px-4">
                <h2 class="text-2xl font-bold text-center mb-8">Tillar</h2>
                <div class="grid grid-cols-2 md:grid-cols-4 gap-5">
                    <div onclick="filterLang('Ingliz')" class="bg-white p-6 rounded-2xl shadow-sm text-center cursor-pointer hover:shadow-md">
                        <span class="text-4xl mb-2 block">🇬🇧</span>
                        <h3 class="font-bold">Ingliz tili</h3>
                    </div>
                    <div onclick="filterLang('Koreys')" class="bg-white p-6 rounded-2xl shadow-sm text-center cursor-pointer hover:shadow-md">
                        <span class="text-4xl mb-2 block">🇰🇷</span>
                        <h3 class="font-bold">Koreys tili</h3>
                    </div>
                    <div onclick="filterLang('Nemis')" class="bg-white p-6 rounded-2xl shadow-sm text-center cursor-pointer hover:shadow-md">
                        <span class="text-4xl mb-2 block">🇩🇪</span>
                        <h3 class="font-bold">Nemis tili</h3>
                    </div>
                    <div onclick="filterLang('Turk')" class="bg-white p-6 rounded-2xl shadow-sm text-center cursor-pointer hover:shadow-md">
                        <span class="text-4xl mb-2 block">🇹🇷</span>
                        <h3 class="font-bold">Turk tili</h3>
                    </div>
                </div>
            </div>
        </section>
    </div>

    <div id="page-partners" class="hidden">
        <section class="py-10">
            <div class="max-w-6xl mx-auto px-4">
                <div class="flex justify-between items-center mb-6">
                    <h2 class="text-2xl font-bold">Suhbatdoshlar</h2>
                    <select id="langFilter" onchange="applyFilter()" class="px-3 py-2 border rounded-lg text-sm">
                        <option value="">Barcha tillar</option>
                        <option>Ingliz</option>
                        <option>Koreys</option>
                        <option>Nemis</option>
                        <option>Turk</option>
                    </select>
                </div>
                <div id="partnersList" class="grid md:grid-cols-2 lg:grid-cols-3 gap-5"></div>
            </div>
        </section>
    </div>

    <div id="page-chat" class="hidden">
        <section class="py-6">
            <div class="max-w-2xl mx-auto px-4">
                <div class="bg-white rounded-2xl shadow-sm overflow-hidden">
                    <div class="bg-violet-600 text-white px-4 py-3 flex justify-between items-center">
                        <div>
                            <button onclick="showPage('partners')" class="mr-2"><i class="fas fa-arrow-left"></i></button>
                            <span id="chatName" class="font-semibold"></span>
                        </div>
                        <span id="chatLang" class="text-sm opacity-80"></span>
                    </div>
                    <div id="chatMessages" class="h-80 overflow-y-auto p-4 space-y-3"></div>
                    <div class="border-t p-3 flex gap-2">
                        <input id="chatInput" type="text" placeholder="Xabar yozing..." class="flex-1 px-4 py-2 border rounded-lg outline-none"
                               onkeyup="if(event.key==='Enter') sendMessage()">
                        <button onclick="sendMessage()" class="bg-violet-600 text-white px-4 py-2 rounded-lg">
                            <i class="fas fa-paper-plane"></i>
                        </button>
                    </div>
                </div>
            </div>
        </section>
    </div>

    <div id="modal" class="hidden fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl max-w-md w-full p-6 relative">
            <button onclick="closeModal()" class="absolute top-4 right-4 text-gray-400"><i class="fas fa-times"></i></button>
            <div id="modalContent"></div>
        </div>
    </div>

    <footer class="bg-gray-900 text-gray-400 py-6 text-center text-sm mt-10"><p>© 2026 SuhbatUZ</p></footer>

    <script>
        const partners = [
            {id:1, name:"Sarah Johnson", lang:"Ingliz", level:"Native", city:"Toshkent", bio:"Ingliz tili o‘qituvchisi. Do‘stona suhbat qilaman."},
            {id:2, name:"Kim Min-jun", lang:"Koreys", level:"Native", city:"Toshkent", bio:"Koreys madaniyati va tili haqida gaplashamiz."},
            {id:3, name:"Hans Müller", lang:"Nemis", level:"Native", city:"Samarqand", bio:"Nemis tili va Germaniya hayoti."},
            {id:4, name:"Ayşe Yılmaz", lang:"Turk", level:"Native", city:"Toshkent", bio:"Turk tili va madaniyati."},
            {id:5, name:"John Smith", lang:"Ingliz", level:"Advanced", city:"Buxoro", bio:"Business English va kundalik suhbat."},
            {id:6, name:"Park Ji-eun", lang:"Koreys", level:"Native", city:"Toshkent", bio:"K-pop va koreys tili."}
        ];
        let filtered = [...partners];
        let currentPartner = null;
        let messages = {};

        function showPage(p) {
            ['home','partners','chat'].forEach(x => document.getElementById('page-'+x).classList.add('hidden'));
            document.getElementById('page-'+p).classList.remove('hidden');
            if(p==='partners') renderPartners(filtered);
        }

        function filterLang(lang) {
            langFilter.value = lang;
            applyFilter();
            showPage('partners');
        }

        function applyFilter() {
            const lang = langFilter.value;
            filtered = lang ? partners.filter(p => p.lang === lang) : [...partners];
            renderPartners(filtered);
        }

        function renderPartners(list) {
            partnersList.innerHTML = list.map(p => `
                <div class="bg-white rounded-xl shadow-sm p-5">
                    <div class="flex items-center gap-3 mb-3">
                        <div class="w-12 h-12 bg-violet-100 rounded-full flex items-center justify-center">
                            <i class="fas fa-user text-violet-600"></i>
                        </div>
                        <div>
                            <h3 class="font-bold">${p.name}</h3>
                            <p class="text-sm text-violet-600">${p.lang} • ${p.level}</p>
                        </div>
                    </div>
                    <p class="text-sm text-gray-600 mb-3">${p.bio}</p>
                    <p class="text-xs text-gray-500 mb-3"><i class="fas fa-map-marker-alt"></i> ${p.city}</p>
                    <button onclick="startChat(${p.id})" class="w-full bg-violet-600 text-white py-2 rounded-lg text-sm font-medium hover:bg-violet-700">
                        Suhbatlashish
                    </button>
                </div>
            `).join('');
        }

        function startChat(id) {
            currentPartner = partners.find(p=>p.id===id);
            chatName.textContent = currentPartner.name;
            chatLang.textContent = currentPartner.lang;
            if(!messages[id]) {
                messages[id] = [
                    {from:'them', text: 'Salom! Qanday yordam bera olaman? 😊'}
                ];
            }
            renderMessages();
            showPage('chat');
        }

        function renderMessages() {
            const msgs = messages[currentPartner.id] || [];
            chatMessages.innerHTML = msgs.map(m => `
                <div class="flex ${m.from==='me'?'justify-end':''}">
                    <div class="${m.from==='me'?'bg-violet-600 text-white':'bg-gray-100'} px-4 py-2 rounded-2xl max-w-[80%] text-sm">
                        ${m.text}
                    </div>
                </div>
            `).join('');
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        function sendMessage() {
            const text = chatInput.value.trim();
            if(!text || !currentPartner) return;
            if(!messages[currentPartner.id]) messages[currentPartner.id] = [];
            messages[currentPartner.id].push({from:'me', text});
            chatInput.value = '';
            renderMessages();

            // Fake reply
            setTimeout(() => {
                const replies = [
                    "Tushundim! Yana nima deb o‘ylaysiz?",
                    "Yaxshi savol. Menimcha...",
                    "Ha, to‘g‘ri!",
                    "Buni amaliyotda sinab ko‘ring.",
                    "Yana bir misol keltira olaman."
                ];
                messages[currentPartner.id].push({from:'them', text: replies[Math.floor(Math.random()*replies.length)]});
                renderMessages();
            }, 1000 + Math.random()*1500);
        }

        renderPartners(partners);
    </script>
</body>
</html>
