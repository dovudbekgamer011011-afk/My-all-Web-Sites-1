<!DOCTYPE html><html lang="uz"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Yoga</title><style>:root{--c:#a21caf}*{margin:0;padding:0;box-sizing:border-box}body{font-family:system-ui,sans-serif;background:#f1f5f9;color:#1e293b;line-height:1.5;min-height:100vh}.container{max-width:900px;margin:0 auto;padding:20px}header{background:var(--c);color:#fff;padding:24px 20px;border-radius:0 0 20px 20px;margin-bottom:24px;text-align:center}header h1{font-size:1.8rem}header p{opacity:.9}.card{background:#fff;border-radius:14px;padding:20px;margin-bottom:16px;box-shadow:0 2px 8px rgba(0,0,0,.06)}h2{color:var(--c);margin-bottom:12px}button{background:var(--c);color:#fff;border:none;padding:10px 18px;border-radius:8px;cursor:pointer;font-size:1rem}button:hover{filter:brightness(1.1)}input,textarea,select{width:100%;padding:10px 12px;border:1px solid #cbd5e1;border-radius:8px;font-size:1rem;margin-bottom:10px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}.item{background:#f8fafc;border-radius:10px;padding:14px;border-left:4px solid var(--c)}footer{text-align:center;color:#94a3b8;font-size:.8rem;padding:20px;margin-top:30px}.success{color:#16a34a}.hidden{display:none}</style></head><body><header><h1>ZenFlow</h1><p>Yoga</p></header><div class="container"><div class="card"><div class="item"><strong>Morning Vinyasa</strong> 07:00</div><div class="item"><strong>Hatha</strong> 12:00</div><div class="item"><strong>Yin</strong> 18:30</div></div><div class="card"><h2>Nafas 4-7-8</h2><p id="b" style="font-size:2rem;text-align:center;padding:20px">Boshlash</p><button onclick="start()" style="width:100%">Boshlash</button></div></div><footer>Ishlaydigan web-sayt</footer><script>let tm;function start(){clearInterval(tm);const ph=[{t:4,x:"Nafas oling"},{t:7,x:"Ushlang"},{t:8,x:"Chiqaring"}];let i=0,c=4;document.getElementById("b").textContent=ph[0].x+" "+c;tm=setInterval(()=>{c--;if(c<=0){i=(i+1)%3;c=ph[i].t}document.getElementById("b").textContent=ph[i].x+" "+c},1000)}</script></body></html>
