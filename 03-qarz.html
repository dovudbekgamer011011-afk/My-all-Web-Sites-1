<!doctype html><html lang=uz><meta charset=utf-8><meta name=viewport content='width=device-width,initial-scale=1'><title>Qarz daftari</title><style>:root{--a:#16a34a;--b:#0d9488}:root{--bg:#f4f5fb;--c:#fff;--t:#1c2033;--m:#6c7293;--l:#e4e7f3}@media(prefers-color-scheme:dark){:root{--bg:#0f1224;--c:#181c36;--t:#eceeff;--m:#9aa0c8;--l:#2a2f55}}*{box-sizing:border-box}body{margin:0;font:15px/1.5 system-ui,sans-serif;background:var(--bg);color:var(--t)}header{background:linear-gradient(135deg,var(--a),var(--b));color:#fff;padding:26px 18px 40px}header h1{margin:0;font-size:26px}header p{margin:4px 0 0;opacity:.85}main{max-width:760px;margin:-22px auto 30px;padding:0 14px;display:grid;gap:14px}.k{background:var(--c);border:1px solid var(--l);border-radius:18px;padding:16px;box-shadow:0 8px 24px rgba(30,40,100,.08)}input,select,textarea{font:inherit;color:var(--t);background:var(--bg);border:1px solid var(--l);border-radius:12px;padding:10px 12px;width:100%;outline:0}input:focus,select:focus,textarea:focus{border-color:var(--a)}button{font:inherit;border:0;border-radius:12px;padding:9px 13px;background:var(--a);color:#fff;font-weight:600;cursor:pointer}button.g{background:var(--bg);color:var(--t);border:1px solid var(--l)}.r{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}.s{text-align:center}.s b{display:block;font-size:26px;color:var(--a)}.s small{color:var(--m)}table{width:100%;border-collapse:collapse}td,th{padding:8px;border-bottom:1px solid var(--l);text-align:left}.i{border:1px solid var(--l);border-radius:14px;padding:12px;margin:8px 0}</style><header><h1>Qarz daftari</h1><p>Kimga qancha qarz berdingiz va kimdan oldingiz — hammasi bir joyda</p></header><main>
<div class=k><div class=r><input id=w placeholder="Kim bilan"><input id=a type=number placeholder="Summa"><select id=dr><option value=1>Men berdim (menga qaytadi)<option value=-1>Men oldim (men qaytaraman)</select><input id=du type=date><input id=nt placeholder="Izoh"><button onclick=add()>Qo'shish</button></div></div>
<div class="k r" id=st></div>
<div class=k><div id=tb style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px"></div><div id=ls></div></div>
<script>const td=()=>new Date().toISOString().slice(0,10),F=[['Faol',e=>e.p<e.a],['Menga qarz',e=>e.p<e.a&&e.s>0],['Mening qarzim',e=>e.p<e.a&&e.s<0],['Yopilgan',e=>e.p>=e.a]],M=n=>Math.round(n).toLocaleString('ru').replace(/,/g,' ')+" so'm";
let d=JSON.parse(localStorage.qrz||'[]'),f=0;
function sv(){localStorage.qrz=JSON.stringify(d);R()}
function add(){if(!w.value||!(+a.value>0))return;d.push({w:w.value,a:+a.value,p:0,s:+dr.value,du:du.value,nt:nt.value,dt:td()});w.value=a.value=nt.value='';sv()}
function pay(i){let x=+prompt("To'langan summa:",d[i].a-d[i].p);if(x>0){d[i].p=Math.min(d[i].a,d[i].p+x);sv()}}
function msg(i){let e=d[i];navigator.clipboard.writeText(`Assalomu alaykum, ${e.w}! ${e.dt} dagi ${M(e.a-e.p)} qarz haqida eslatib o'tmoqchiman${e.du?', muddat: '+e.du:''}. Rahmat!`);alert('Eslatma matni nusxalandi')}
function R(){let o=d.filter(e=>e.p<e.a),me=o.filter(e=>e.s>0).reduce((s,e)=>s+e.a-e.p,0),yu=o.filter(e=>e.s<0).reduce((s,e)=>s+e.a-e.p,0);
st.innerHTML=`<div class=s><b style=color:#16a34a>${M(me)}</b><small>menga qaytadi</small></div><div class=s><b style=color:#e11d48>${M(yu)}</b><small>men qaytaraman</small></div><div class=s><b>${M(me-yu)}</b><small>sof balans</small></div>`;
tb.innerHTML=F.map((x,i)=>`<button class="${i==f?'':'g'}" onclick="f=${i};R()">${x[0]}</button>`).join('');
ls.innerHTML=d.map((e,i)=>F[f][1](e)?`<div class=i style="${e.p<e.a&&e.du&&e.du<td()?'border-color:#e11d48':''}"><div style="display:flex;justify-content:space-between;gap:8px"><b>${e.s>0?'⬆':'⬇'} ${e.w}</b><b style="color:${e.s>0?'#16a34a':'#e11d48'}">${M(e.a-e.p)}</b></div><small style="color:var(--m)">Jami ${M(e.a)} · to'langan ${M(e.p)} ${e.du?'· muddat '+e.du:''} ${e.nt?'· '+e.nt:''}</small><div style="display:flex;gap:6px;margin-top:8px"><button onclick=pay(${i})>To'lov</button>${e.s>0?`<button class=g onclick=msg(${i})>Eslatma</button>`:''}<button class=g onclick="confirm('O\'chirilsinmi?')&&(d.splice(${i},1),sv())">✕</button></div></div>`:'').join('')||'<p>Bo\'sh</p>'}
R()</script>
