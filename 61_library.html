<!DOCTYPE html><html lang="uz"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Library</title><style>:root{--c:#7c2d12}*{margin:0;padding:0;box-sizing:border-box}body{font-family:system-ui,sans-serif;background:#f1f5f9;color:#1e293b;line-height:1.5;min-height:100vh}.container{max-width:900px;margin:0 auto;padding:20px}header{background:var(--c);color:#fff;padding:24px 20px;border-radius:0 0 20px 20px;margin-bottom:24px;text-align:center}header h1{font-size:1.8rem}header p{opacity:.9}.card{background:#fff;border-radius:14px;padding:20px;margin-bottom:16px;box-shadow:0 2px 8px rgba(0,0,0,.06)}h2{color:var(--c);margin-bottom:12px}button{background:var(--c);color:#fff;border:none;padding:10px 18px;border-radius:8px;cursor:pointer;font-size:1rem}button:hover{filter:brightness(1.1)}input,textarea,select{width:100%;padding:10px 12px;border:1px solid #cbd5e1;border-radius:8px;font-size:1rem;margin-bottom:10px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}.item{background:#f8fafc;border-radius:10px;padding:14px;border-left:4px solid var(--c)}footer{text-align:center;color:#94a3b8;font-size:.8rem;padding:20px;margin-top:30px}.success{color:#16a34a}.hidden{display:none}</style></head><body><header><h1>BookNest</h1><p>Kitoblar</p></header><div class="container"><div class="card"><input id="q" placeholder="Qidirish..." oninput="f()"></div><div id="b"></div><div class="card"><h2>O'qilayotgan</h2><div id="r"></div></div></div><footer>Ishlaydigan web-sayt</footer><script>let rd=JSON.parse(localStorage.getItem("rd")||"[]");const B=[{id:1,t:"Atomic Habits",a:"Clear"},{id:2,t:"Alchemist",a:"Coelho"},{id:3,t:"Sapiens",a:"Harari"},{id:4,t:"Deep Work",a:"Newport"}];function f(){const q=document.getElementById("q").value.toLowerCase();document.getElementById("b").innerHTML=B.filter(x=>x.t.toLowerCase().includes(q)).map(x=>`<div class="card"><h3>${x.t}</h3><p style="color:#64748b">${x.a}</p><button onclick="start(${x.id})" ${rd.find(r=>r.id===x.id)?"disabled style=\"background:#94a3b8\"":""}>${rd.find(r=>r.id===x.id)?"O'qilmoqda":"Boshlash"}</button></div>`).join("");rr()}function start(id){if(!rd.find(r=>r.id===id)){rd.push({...B.find(x=>x.id===id),p:0});localStorage.setItem("rd",JSON.stringify(rd));f()}}function sp(id,v){rd=rd.map(r=>r.id===id?{...r,p:+v}:r);localStorage.setItem("rd",JSON.stringify(rd));rr()}function rr(){document.getElementById("r").innerHTML=rd.length?rd.map(r=>`<div class="item"><strong>${r.t}</strong><br><input type="range" min="0" max="100" value="${r.p}" onchange="sp(${r.id},this.value)"> ${r.p}%</div>`).join(""):"<p style=\"color:#94a3b8\">Yo'q</p>"}f()</script></body></html>
