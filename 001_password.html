<!DOCTYPE html><html lang="uz"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Parol Generator</title><style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0b0b10;--card:#16161d;--border:rgba(255,255,255,.08);--text:#e8e8ed;--muted:#94a3b8;--accent:#8b5cf6;--accent2:#3b82f6;--ok:#22c55e;--danger:#ef4444}
body{font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;line-height:1.5}
.wrap{max-width:880px;margin:0 auto;padding:28px 18px}
.hero{text-align:center;margin-bottom:28px}
.hero h1{font-size:1.7rem;font-weight:700;background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:6px}
.hero p{color:var(--muted);font-size:.95rem}
.card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:22px;margin-bottom:16px;box-shadow:0 4px 24px rgba(0,0,0,.25)}
.card h2{font-size:1.05rem;font-weight:600;margin-bottom:14px}
label{display:block;font-size:.82rem;color:var(--muted);margin-bottom:6px}
input,select,textarea{width:100%;padding:11px 13px;border-radius:12px;border:1px solid var(--border);background:rgba(0,0,0,.35);color:var(--text);font-size:.95rem;margin-bottom:12px;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--accent)}
button{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border:none;padding:11px 18px;border-radius:12px;font-size:.95rem;font-weight:600;cursor:pointer}
button:hover{filter:brightness(1.08)}
button.sec{background:rgba(255,255,255,.06);border:1px solid var(--border)}
button.danger{background:linear-gradient(135deg,#ef4444,#b91c1c)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row>*{flex:1;min-width:100px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.pill{display:inline-block;padding:3px 10px;border-radius:999px;font-size:.75rem;background:rgba(139,92,246,.15);color:#c4b5fd}
.muted{color:var(--muted);font-size:.88rem}
.ok{color:var(--ok)}.danger-t{color:var(--danger)}
.stat{text-align:center;padding:14px;background:rgba(0,0,0,.25);border-radius:12px}
.stat .n{font-size:1.45rem;font-weight:700}
.list-item{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--border)}
.list-item:last-child{border-bottom:none}
.empty{text-align:center;color:var(--muted);padding:24px}
footer{text-align:center;color:#64748b;font-size:.78rem;margin-top:36px;padding-bottom:20px}
</style></head><body><div class="wrap">
<div class="hero"><h1>🔐 Parol Generator</h1><p>Kuchli parol yarating va saqlang</p></div>
<div class="card">
<label>Uzunlik: <span id="lv">16</span></label>
<input type="range" id="len" min="8" max="64" value="16" oninput="document.getElementById('lv').textContent=this.value;gen()">
<div class="row" style="margin:12px 0">
<label style="display:flex;gap:6px;align-items:center;cursor:pointer"><input type="checkbox" id="u" checked style="width:auto;margin:0"> A-Z</label>
<label style="display:flex;gap:6px;align-items:center;cursor:pointer"><input type="checkbox" id="l" checked style="width:auto;margin:0"> a-z</label>
<label style="display:flex;gap:6px;align-items:center;cursor:pointer"><input type="checkbox" id="n" checked style="width:auto;margin:0"> 0-9</label>
<label style="display:flex;gap:6px;align-items:center;cursor:pointer"><input type="checkbox" id="s" checked style="width:auto;margin:0"> !@#</label>
</div>
<div id="pass" style="background:rgba(0,0,0,.4);border-radius:12px;padding:18px;text-align:center;font-size:1.15rem;letter-spacing:1px;word-break:break-all;min-height:56px;display:flex;align-items:center;justify-content:center;margin:14px 0"></div>
<div class="row"><button onclick="gen()">Yangi</button><button class="sec" onclick="copyP()">Nusxa</button><button class="sec" onclick="saveP()">Saqlash</button></div>
<p id="msg" class="muted" style="text-align:center;margin-top:10px"></p>
</div>
<div class="card"><h2>Saqlangan</h2><div id="saved"></div></div>
<footer>Ishlaydigan web-sayt</footer></div>
<script>
let saved=JSON.parse(localStorage.getItem("pwds")||"[]");
function gen(){const len=+document.getElementById("len").value;let c="";
if(document.getElementById("u").checked)c+="ABCDEFGHIJKLMNOPQRSTUVWXYZ";
if(document.getElementById("l").checked)c+="abcdefghijklmnopqrstuvwxyz";
if(document.getElementById("n").checked)c+="0123456789";
if(document.getElementById("s").checked)c+="!@#$%^&*()_+-=[]{}|;:,.<>?";
if(!c){document.getElementById("pass").textContent="Belgi tanlang";return}
const a=new Uint32Array(len);crypto.getRandomValues(a);let p="";for(let i=0;i<len;i++)p+=c[a[i]%c.length];
document.getElementById("pass").textContent=p;document.getElementById("msg").textContent=""}
function copyP(){const t=document.getElementById("pass").textContent;if(!t||t==="Belgi tanlang")return;navigator.clipboard.writeText(t).then(()=>{document.getElementById("msg").textContent="✓ Nusxa olindi";document.getElementById("msg").className="ok"})}
function saveP(){const t=document.getElementById("pass").textContent;if(!t||t==="Belgi tanlang")return;const label=prompt("Nomi:")||"Parol";saved.unshift({id:Date.now(),label,pass:t});localStorage.setItem("pwds",JSON.stringify(saved));renderS()}
function delS(id){saved=saved.filter(x=>x.id!==id);localStorage.setItem("pwds",JSON.stringify(saved));renderS()}
function renderS(){document.getElementById("saved").innerHTML=saved.length?saved.map(x=>`<div class="list-item"><div style="flex:1"><strong>${x.label}</strong><div class="muted" style="font-family:monospace">${x.pass}</div></div><button class="sec" style="padding:6px 10px" onclick="navigator.clipboard.writeText('${x.pass}')">Nusxa</button><button class="danger" style="padding:6px 10px" onclick="delS(${x.id})">×</button></div>`).join(""):'<div class="empty">Hali yo\'q</div>'}
["u","l","n","s"].forEach(id=>document.getElementById(id).onchange=gen);gen();renderS();
</script></body></html>
