<!DOCTYPE html><html lang="uz"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DIY</title><style>:root{--c:#c2410c}*{margin:0;padding:0;box-sizing:border-box}body{font-family:system-ui,sans-serif;background:#f1f5f9;color:#1e293b;line-height:1.5;min-height:100vh}.container{max-width:900px;margin:0 auto;padding:20px}header{background:var(--c);color:#fff;padding:24px 20px;border-radius:0 0 20px 20px;margin-bottom:24px;text-align:center}header h1{font-size:1.8rem}header p{opacity:.9}.card{background:#fff;border-radius:14px;padding:20px;margin-bottom:16px;box-shadow:0 2px 8px rgba(0,0,0,.06)}h2{color:var(--c);margin-bottom:12px}button{background:var(--c);color:#fff;border:none;padding:10px 18px;border-radius:8px;cursor:pointer;font-size:1rem}button:hover{filter:brightness(1.1)}input,textarea,select{width:100%;padding:10px 12px;border:1px solid #cbd5e1;border-radius:8px;font-size:1rem;margin-bottom:10px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}.item{background:#f8fafc;border-radius:10px;padding:14px;border-left:4px solid var(--c)}footer{text-align:center;color:#94a3b8;font-size:.8rem;padding:20px;margin-top:30px}.success{color:#16a34a}.hidden{display:none}</style></head><body><header><h1>MakeIt</h1><p>DIY</p></header><div class="container"><div class="card"><select id="lv" onchange="f()"><option value="all">Barcha</option><option>Boshlang'ich</option><option>O'rta</option><option>Qiyin</option></select></div><div id="p"></div><div class="card"><h2>Mening</h2><div id="my"></div></div></div><footer>Ishlaydigan web-sayt</footer><script>let my=JSON.parse(localStorage.getItem("diy")||"[]");const P=[{id:1,t:"Yog'och javon",l:"Boshlang'ich",tm:"2 soat"},{id:2,t:"Makrame",l:"O'rta",tm:"3 soat"},{id:3,t:"Guldon",l:"Boshlang'ich",tm:"1 soat"},{id:4,t:"Stol",l:"Qiyin",tm:"8 soat"}];function f(){const l=document.getElementById("lv").value;document.getElementById("p").innerHTML=P.filter(x=>l==="all"||x.l===l).map(x=>`<div class="card"><h3>${x.t}</h3><p>${x.l} · ${x.tm}</p><button onclick="st(${x.id})" ${my.includes(x.id)?"disabled style=\"background:#94a3b8\"":""}>${my.includes(x.id)?"Boshlangan":"Boshlash"}</button></div>`).join("");rm()}function st(id){if(!my.includes(id)){my.push(id);localStorage.setItem("diy",JSON.stringify(my));f()}}function rm(){document.getElementById("my").innerHTML=my.length?my.map(id=>`<div class="item">${P.find(x=>x.id===id).t}</div>`).join(""):"<p style=\"color:#94a3b8\">Yo'q</p>"}f()</script></body></html>
