<!DOCTYPE html><html lang="uz"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Weather</title><style>:root{--c:#0ea5e9}*{margin:0;padding:0;box-sizing:border-box}body{font-family:system-ui,sans-serif;background:#f1f5f9;color:#1e293b;line-height:1.5;min-height:100vh}.container{max-width:900px;margin:0 auto;padding:20px}header{background:var(--c);color:#fff;padding:24px 20px;border-radius:0 0 20px 20px;margin-bottom:24px;text-align:center}header h1{font-size:1.8rem}header p{opacity:.9}.card{background:#fff;border-radius:14px;padding:20px;margin-bottom:16px;box-shadow:0 2px 8px rgba(0,0,0,.06)}h2{color:var(--c);margin-bottom:12px}button{background:var(--c);color:#fff;border:none;padding:10px 18px;border-radius:8px;cursor:pointer;font-size:1rem}button:hover{filter:brightness(1.1)}input,textarea,select{width:100%;padding:10px 12px;border:1px solid #cbd5e1;border-radius:8px;font-size:1rem;margin-bottom:10px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}.item{background:#f8fafc;border-radius:10px;padding:14px;border-left:4px solid var(--c)}footer{text-align:center;color:#94a3b8;font-size:.8rem;padding:20px;margin-top:30px}.success{color:#16a34a}.hidden{display:none}</style></head><body><header><h1>SkyCast</h1><p>Ob-havo</p></header><div class="container"><div class="card"><select id="c" onchange="s()"><option value="t">Toshkent</option><option value="s">Samarqand</option><option value="b">Buxoro</option></select></div><div class="card" style="text-align:center"><div style="font-size:3rem;font-weight:700;color:var(--c)" id="temp">—</div><p id="desc"></p></div><div class="card"><h2>5 kun</h2><div class="grid" id="f"></div></div></div><footer>Ishlaydigan web-sayt</footer><script>const D={t:{t:22,d:"Bulutli",days:[24,26,23,21,25]},s:{t:20,d:"Quyoshli",days:[22,25,24,20,23]},b:{t:24,d:"Issiq",days:[26,28,25,23,27]}};const days=["J","Sh","Y","D","S"];function s(){const x=D[document.getElementById("c").value];document.getElementById("temp").textContent=x.t+"°C";document.getElementById("desc").textContent=x.d;document.getElementById("f").innerHTML=x.days.map((t,i)=>`<div class="item" style="text-align:center"><strong>${days[i]}</strong><br>${t}°</div>`).join("")}s()</script></body></html>
