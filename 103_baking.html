<!DOCTYPE html><html lang="uz"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Baking</title><style>:root{--c:#9a3412}*{margin:0;padding:0;box-sizing:border-box}body{font-family:system-ui,sans-serif;background:#f1f5f9;color:#1e293b;line-height:1.5;min-height:100vh}.container{max-width:900px;margin:0 auto;padding:20px}header{background:var(--c);color:#fff;padding:24px 20px;border-radius:0 0 20px 20px;margin-bottom:24px;text-align:center}header h1{font-size:1.8rem}header p{opacity:.9}.card{background:#fff;border-radius:14px;padding:20px;margin-bottom:16px;box-shadow:0 2px 8px rgba(0,0,0,.06)}h2{color:var(--c);margin-bottom:12px}button{background:var(--c);color:#fff;border:none;padding:10px 18px;border-radius:8px;cursor:pointer;font-size:1rem}button:hover{filter:brightness(1.1)}input,textarea,select{width:100%;padding:10px 12px;border:1px solid #cbd5e1;border-radius:8px;font-size:1rem;margin-bottom:10px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}.item{background:#f8fafc;border-radius:10px;padding:14px;border-left:4px solid var(--c)}footer{text-align:center;color:#94a3b8;font-size:.8rem;padding:20px;margin-top:30px}.success{color:#16a34a}.hidden{display:none}</style></head><body><header><h1>SweetOven</h1><p>Pishiriq</p></header><div class="container"><div class="card"><input id="q" placeholder="Qidirish..." oninput="f()"></div><div id="l"></div><div id="d" class="card hidden"></div></div><footer>Ishlaydigan web-sayt</footer><script>const R=[{id:1,n:"Shokoladli pechenye",t:"27 daq",i:["sariyog'","shakar","un","shokolad"],s:["Aralashtiring","Pishiring"]},{id:2,n:"Non",t:"3 soat",i:["un","xamir turishi","suv"],s:["Qoring","Ko'tarilsin","Pishiring"]}];function f(){const q=document.getElementById("q").value.toLowerCase();document.getElementById("l").innerHTML=R.filter(x=>x.n.toLowerCase().includes(q)).map(x=>`<div class="card" style="cursor:pointer" onclick="show(${x.id})"><h2>${x.n}</h2><p style="color:#64748b">${x.t}</p></div>`).join("")}function show(id){const r=R.find(x=>x.id===id);document.getElementById("d").classList.remove("hidden");document.getElementById("d").innerHTML=`<h2>${r.n}</h2><ul>${r.i.map(x=>"<li>"+x+"</li>").join("")}</ul><ol>${r.s.map(x=>"<li>"+x+"</li>").join("")}</ol><button onclick="document.getElementById('d').classList.add('hidden')" style="margin-top:8px;background:#64748b">Yopish</button>`}f()</script></body></html>
