<!doctype html><html lang=uz><meta charset=utf-8><meta name=viewport content='width=device-width,initial-scale=1'><title>Mijozlar bazasi (CRM)</title><style>:root{--a:#0891b2;--b:#6366f1}:root{--bg:#f4f5fb;--c:#fff;--t:#1c2033;--m:#6c7293;--l:#e4e7f3}@media(prefers-color-scheme:dark){:root{--bg:#0f1224;--c:#181c36;--t:#eceeff;--m:#9aa0c8;--l:#2a2f55}}*{box-sizing:border-box}body{margin:0;font:15px/1.5 system-ui,sans-serif;background:var(--bg);color:var(--t)}header{background:linear-gradient(135deg,var(--a),var(--b));color:#fff;padding:26px 18px 40px}header h1{margin:0;font-size:26px}header p{margin:4px 0 0;opacity:.85}main{max-width:760px;margin:-22px auto 30px;padding:0 14px;display:grid;gap:14px}.k{background:var(--c);border:1px solid var(--l);border-radius:18px;padding:16px;box-shadow:0 8px 24px rgba(30,40,100,.08)}input,select,textarea{font:inherit;color:var(--t);background:var(--bg);border:1px solid var(--l);border-radius:12px;padding:10px 12px;width:100%;outline:0}input:focus,select:focus,textarea:focus{border-color:var(--a)}button{font:inherit;border:0;border-radius:12px;padding:9px 13px;background:var(--a);color:#fff;font-weight:600;cursor:pointer}button.g{background:var(--bg);color:var(--t);border:1px solid var(--l)}.r{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}.s{text-align:center}.s b{display:block;font-size:26px;color:var(--a)}.s small{color:var(--m)}table{width:100%;border-collapse:collapse}td,th{padding:8px;border-bottom:1px solid var(--l);text-align:left}.i{border:1px solid var(--l);border-radius:14px;padding:12px;margin:8px 0}</style><header><h1>Mijozlar bazasi (CRM)</h1><p>Mijozlar, savdo bosqichi, izohlar va qayta aloqa sanasi</p></header><main>
<div class=k><div class=r><input id=n placeholder="Mijoz ismi"><input id=ph placeholder="Telefon"><input id=co placeholder="Kompaniya"><button onclick=add()>Qo'shish</button></div></div>
<div class="k r" id=sts></div>
<div class=k><div class=r style="margin-bottom:6px"><input id=q placeholder="Qidirish…" oninput=R()><select id=fs onchange=R()></select></div><div id=ls></div></div>
<script>const ST=['Yangi','Muzokara','Shartnoma',"Yo'qotilgan"],td=()=>new Date().toISOString().slice(0,10);
let d=JSON.parse(localStorage.crm||'[]');fs.innerHTML='<option value=-1>Barcha bosqichlar'+ST.map((x,i)=>`<option value=${i}>${x}`).join('');
function sv(){localStorage.crm=JSON.stringify(d);R()}
function add(){if(!n.value)return;d.push({n:n.value,ph:ph.value,co:co.value,st:0,fu:'',nt:[]});n.value=ph.value=co.value='';sv()}
function note(i){let t=prompt('Izoh:');if(t){d[i].nt.push({d:td(),t});sv()}}
function R(){sts.innerHTML=ST.map((x,i)=>`<div class=s><b>${d.filter(c=>c.st==i).length}</b><small>${x}</small></div>`).join('');let f=q.value.toLowerCase();
ls.innerHTML=d.map((c,i)=>(fs.value<0||c.st==fs.value)&&(c.n+c.co+c.ph).toLowerCase().includes(f)?`<div class=i><div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center"><b>${c.n}</b><small style="color:var(--m)">${c.co} ${c.ph?`· <a href="tel:${c.ph}">${c.ph}</a>`:''}</small><select style="width:auto;margin-left:auto" onchange="d[${i}].st=+this.value;sv()">${ST.map((x,j)=>`<option value=${j} ${j==c.st?'selected':''}>${x}`).join('')}</select></div>
<div style="display:flex;gap:8px;align-items:center;margin:8px 0"><small>Qayta aloqa:</small><input type=date style="width:auto;${c.fu&&c.fu<td()&&c.st<2?'border-color:#e11d48;color:#e11d48':''}" value="${c.fu}" onchange="d[${i}].fu=this.value;sv()"><button class=g onclick=note(${i})>+ Izoh</button><button class=g onclick="confirm('O\'chirilsinmi?')&&(d.splice(${i},1),sv())">✕</button></div>
${c.nt.slice(-3).reverse().map(x=>`<div style="font-size:13px;color:var(--m)">${x.d}: ${x.t}</div>`).join('')}</div>`:'').join('')||'<p>Mijozlar yo\'q</p>'}
R()</script>
